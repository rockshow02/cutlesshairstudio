      - name: message
        label: Pesan
        type: string
        required: true
        description: "Tampil sebagai bar tipis di atas menu. Maksimal 160 karakter."
        options:
          maxlength: 160
      - name: type
        label: Jenis
        type: select
        default: Info
        description: '"Tutup" tampil paling menonjol.'
        options:
          values: [Info, Tutup, Jam Khusus]
      - name: startDate
        label: Mulai tampil
        type: date
        default: ""
        description: "Opsional (WIB). Kosong = langsung tampil."
        options:
          time: true
          format: "yyyy-MM-dd'T'HH:mm"
      - name: endDate
        label: Selesai tampil
        type: date
        default: ""
        description: "Opsional (WIB). Kosong = tampil sampai dimatikan."
        options:
          time: true
          format: "yyyy-MM-dd'T'HH:mm"
      - name: branchSlugs
        label: Berlaku di cabang
        type: select
        description: "Kosongkan = tampil di SEMUA cabang. Pengumuman jenis Tutup atau Jam Khusus mengubah status buka cabang yang dipilih. Pilih satu atau beberapa bila khusus cabang tertentu."
        options:
          multiple: true
          # @branch-options-start (diisi otomatis dari branches.json oleh scripts/sync-pages-config.mjs)
          values:
            - name: "bogor-bantarjati"
              label: "Bogor Bantarjati"
            - name: "cibubur"
              label: "Cibubur"
          # @branch-options-end
      - name: isActive
        label: Aktif
        type: boolean
        default: true

  # ------------------------------------------------------------------ Testimoni
  - name: testimonials
    label: Testimoni
    type: file
    path: src/content/testimonials.json
    format: json
    list: true
    fields:
      - name: author
        label: Nama pemberi ulasan
        type: string
        required: true
        description: "Tulis seperti di Google, mis. Aditya R. Maksimal 60 karakter."
        options:
          maxlength: 60
      - name: rating
        label: Bintang (1–5)
        type: number
        required: true
        default: 5
        options:
          min: 1
          max: 5
      - name: text
        label: Isi ulasan
        type: text
        required: true
        description: "Salin dari ulasan asli. Jangan mengarang ulasan. Maksimal 500 karakter."
        options:
          maxlength: 500
      - name: date
        label: Tanggal ulasan
        type: date
        default: ""
        description: "Opsional. Ditampilkan sebagai '2 minggu lalu' dsb."
      - name: source
        label: Sumber
        type: select
        default: Google
        options:
          values: [Google, Instagram, TikTok, Langsung]
      - name: order
        label: Urutan
        type: number
        default: 0
        options:
          min: 0
      - name: isActive
        label: Tampilkan di website
        type: boolean
        default: true

  # ------------------------------------------------------------------ Produk
  - name: products
    label: Produk
    type: file
    path: src/content/products.json
    format: json
    list: true
    fields:
      - name: name
        label: Nama produk
        type: string
        required: true
        description: "Contoh: Water Based Pomade. Maksimal 80 karakter."
        options:
          maxlength: 80
      - name: category
        label: Kategori
        type: select
        required: true
        default: Pomade
        options:
          values: [Pomade, Hair Clay, Hair Powder, Hair Tonic, Hair Spray, Shampoo & Conditioner, Beard Care, Aksesoris, Lainnya]
      - name: price
        label: Harga jual (Rupiah)
        type: number
        required: true
        description: "Angka saja, tanpa titik dan tanpa Rp. Contoh: 95000"
        options:
          min: 0
      - name: compareAtPrice
        label: Harga coret (opsional)
        type: number
        description: "Harga sebelum diskon, tampil dicoret. Harus lebih besar dari harga jual. Kosongkan bila tidak diskon."
        options:
          min: 0
      - name: size
        label: Isi / ukuran
        type: string
        description: "Contoh: 100 ml atau 80 gr. Maksimal 30 karakter."
        options:
          maxlength: 30
      - name: description
        label: Deskripsi singkat
        type: text
        description: "Manfaat & cocok untuk siapa. Maksimal 400 karakter."
        options:
          maxlength: 400
      - name: image
        label: Foto produk
        type: image
        description: "Foto persegi (1:1) latar polos, minimal 1000 × 1000 px. Kompres di bawah 1 MB sebelum upload. Dikompres otomatis ke WebP maks. 1000 px. Kosong = gambar logo. Format: JPG, PNG, atau WebP."
        options:
          media: products
          extensions: [jpg, jpeg, png, webp]
      - name: badge
        label: Label khusus
        type: select
        description: "Opsional. Kosongkan bila tidak perlu."
        options:
          values: [Best Seller, Baru, Promo]
      - name: inStock
        label: Stok tersedia
        type: boolean
        default: true
        description: "Matikan bila stok habis: produk tetap tampil dengan label Stok habis dan tombol Tanya stok."
      - name: shopeeUrl
        label: Link Shopee (opsional)
        type: string
        pattern:
          regex: "^(https?://.+)?$"
          message: Harus diawali https://
      - name: tokopediaUrl
        label: Link Tokopedia (opsional)
        type: string
        pattern:
          regex: "^(https?://.+)?$"
          message: Harus diawali https://
      - name: order
        label: Urutan
        type: number
        default: 0
        description: "Angka kecil tampil lebih dulu (10, 20, 30, ...)."
        options:
          min: 0
      - name: isActive
        label: Tampilkan di website
        type: boolean
        default: true
        description: "Matikan untuk menyembunyikan tanpa menghapus."

  # ------------------------------------------------------------------ Pengaturan Situs
  - name: settings
    label: Pengaturan Situs
    type: file
    path: src/content/settings.json
    format: json
    fields:
      - name: logo
        label: Logo footer
        type: image
        description: "PNG/WebP transparan, versi putih, lebar minimal 400 px. Kompres di bawah 1 MB sebelum upload. Format: JPG, PNG, atau WebP."
        options:
          media: site
          extensions: [jpg, jpeg, png, webp]
      - name: siteName
        label: Nama usaha
        type: string
        required: true
        options:
          maxlength: 80
        description: Maksimal 80 karakter.
      - name: siteUrl
        label: Alamat website (domain resmi)
        type: string
        required: true
        description: "Mis. https://cutlesshairstudio.com (tanpa garis miring di akhir). Satu-satunya sumber domain untuk Google, sitemap, dan preview link."
        pattern:
          regex: "^https://[^\\s]+[^/]$"
          message: Diawali https:// dan tanpa garis miring di akhir
      - name: mainWhatsappNumber
        label: Nomor WhatsApp pusat
        type: string
        required: true
        description: "Untuk pertanyaan umum (footer). Booking memakai nomor WhatsApp masing-masing cabang. Format 628xxxxxxxxxx."
        pattern:
          regex: "^62\\d{8,13}$"
          message: Format harus 628xxxxxxxxxx (tanpa +, spasi, atau strip)
      - name: defaultWaMessage
        label: Pesan booking default
        type: text
        description: "Boleh pakai {brand} dan {branch} (nama cabang). Contoh: Halo {brand} cabang {branch}, saya mau booking haircut untuk [hari/jam]. Maksimal 500 karakter."
        options:
          maxlength: 500
      - name: barberWaMessage
        label: Template pesan booking kapster
        type: text
        description: "Dipakai semua tombol \"Booking [nama barber]\". Placeholder (huruf kecil): {brand} = nama usaha, {branch} = cabang barber, {barber} = nama barber yang diklik. Kosong = template bawaan. Maksimal 500 karakter (emoji dihitung 2); sisakan ruang untuk nama barber & cabang."
        pattern:
          regex: '^(?:[^{}]|\{(?:brand|branch|barber)\})*$'
          message: Placeholder yang boleh dipakai hanya {brand}, {branch}, dan {barber} (huruf kecil)
        options:
          maxlength: 500
      - name: instagramUrl
        label: Link Instagram
        type: string
        description: "Kosongkan untuk menyembunyikan ikon."
        pattern:
          regex: "^(https?://.+)?$"
          message: Harus diawali https://
      - name: tiktokUrl
        label: Link TikTok
        type: string
        description: "Kosongkan untuk menyembunyikan ikon."
        pattern:
          regex: "^(https?://.+)?$"
          message: Harus diawali https://
      - name: email
        label: Email
        type: string
        description: "Opsional, tampil di footer. Kosongkan untuk menyembunyikan baris email. Maksimal 100 karakter."
        pattern:
          regex: '^([^@\s]+@[^@\s]+\.[^@\s]+)?$'
          message: Format email tidak valid, mis. halo@cutlesshairstudio.com
        options:
          maxlength: 100
      - name: footerTagline
        label: Tagline footer
        type: text
        default: "Hair studio di {cities}. Goodstyle, goodmood."
        description: "Kalimat singkat di bawah logo footer. {cities} diganti otomatis dengan kota cabang aktif, mis. Bogor & Cibubur. Maksimal 160 karakter."
        options:
          maxlength: 160
      - name: stats
        label: Angka statistik
        type: object
        description: "Jumlah cabang & hairstylist dihitung otomatis. Angka di bawah hanya tampil bila tombolnya dinyalakan; isi dengan angka ASLI."
        fields:
          - name: customers
            label: Jumlah pelanggan
            type: number
            options:
              min: 0
          - name: showCustomers
            label: Tampilkan jumlah pelanggan
            type: boolean
            default: false
          - name: foundedYear
            label: Tahun berdiri
            type: number
            options:
              min: 1900
              max: 2100
          - name: showFoundedYear
            label: Tampilkan tahun berdiri
            type: boolean
            default: false
          - name: rating
            label: Rating Google
            type: string
            description: "Mis. 4.9 (sesuai rating di Google Maps)."
            pattern:
              regex: "^([1-4]([.,]\\d)?|5([.,]0)?)?$"
              message: Angka 1–5, mis. 4.9
          - name: showRating
            label: Tampilkan rating
            type: boolean
            default: false
          - name: reviewCount
            label: Jumlah ulasan Google
            type: number
            options:
              min: 0
          - name: showReviewCount
            label: Tampilkan jumlah ulasan
            type: boolean
            default: false
          - name: reviewsUrl
            label: Link halaman ulasan
            type: string
            description: "Untuk tombol Lihat semua ulasan (link Google Maps bisnis)."
            pattern:
              regex: "^(https?://.+)?$"
              message: Harus diawali https://
      - name: showTestimonials
        label: Tampilkan section Testimoni
        type: boolean
        default: false
        description: "Nyalakan setelah ada ulasan asli di menu Testimoni."
      - name: showProducts
        label: Tampilkan Produk
        type: boolean
        default: false
        description: "Nyalakan setelah data produk asli lengkap. Mati = section & menu Produk disembunyikan."
      - name: showBeforeAfter
        label: Tampilkan Before / After
        type: boolean
        default: false
        description: "Nyalakan setelah foto sebelum-sesudah asli tersedia."
      - name: enablePreloader
        label: Tampilkan animasi pembuka
        type: boolean
        default: true
        description: "Logo Cutless beranimasi saat website pertama kali dibuka (sekali per kunjungan, maks. 1,5 detik)."
      - name: preloaderVideo
        label: Video animasi pembuka (opsional)
        type: file
        description: "MP4/WebM tanpa suara, maks. 500 KB dan ±1,5 detik. Kosongkan untuk memakai animasi logo. Format: MP4 atau WebM."
        options:
          media: videos
          extensions: [mp4, webm]
