# Konfigurasi Pages CMS (https://pagescms.org) untuk website Cutless Hair Studio.
# Admin login di https://app.pagescms.org dengan akun GitHub (harus kolaborator repo ini).
# Setiap "Simpan" = 1 commit ke branch yang dipilih → Cloudflare build & deploy otomatis (±1–2 menit).
#
# Skema field harus sama dengan src/content/schema.ts (validasi Zod saat build).
# Pilihan cabang (blok "@branch-options") disinkronkan otomatis dari src/content/branches.json
# oleh GitHub Actions (npm run sync-cms). Jangan diedit manual.

media:
  - name: branches
    label: Foto Cabang
    input: public/uploads/branches
    output: /uploads/branches
    categories: [image]
    rename: safe
  - name: barbers
    label: Foto Barber
    input: public/uploads/barbers
    output: /uploads/barbers
    categories: [image]
    rename: safe
  - name: gallery
    label: Foto Galeri
    input: public/uploads/gallery
    output: /uploads/gallery
    categories: [image]
    rename: safe
  - name: promos
    label: Gambar Promo
    input: public/uploads/promos
    output: /uploads/promos
    categories: [image]
    rename: safe
  - name: products
    label: Foto Produk
    input: public/uploads/products
    output: /uploads/products
    categories: [image]
    rename: safe
  - name: site
    label: Logo
    input: public/uploads/site
    output: /uploads/site
    categories: [image]
    rename: safe
  - name: videos
    label: Video
    input: public/uploads/videos
    output: /uploads/videos
    categories: [video]
    rename: safe

content:
  # ------------------------------------------------------------------ Cabang, Barber, Daftar Harga
  # PINDAH ke database booking (D1) di branch ini: kelola lewat dashboard /admin → Pengaturan.
  # File src/content/branches.json, barbers.json, pricing.json kini hanya salinan untuk build
  # (SEO halaman cabang & pilihan cabang di Promo/Pengumuman). Perbarui dengan npm run export-catalog.
  # Folder media "Foto Cabang" & "Foto Barber" tetap bisa dipakai untuk upload foto (salin path-nya ke /admin).

  # ------------------------------------------------------------------ Cabang
  - name: gallery
    label: Galeri
    type: file
    path: src/content/gallery.json
    format: json
    list: true
    fields:
      - name: image
        label: Foto
        type: image
        required: true
        description: "Foto tegak tampil tinggi, foto lebar tampil lebar (otomatis). Dikompres ke WebP maks. 1600 px."
        options:
          media: gallery
      - name: altText
        label: Deskripsi foto
        type: string
        required: true
        description: "Wajib. Jelaskan isi foto, mis. \"Mid fade dengan textured crop\"."
        options:
          maxlength: 150
      - name: styleCategory
        label: Gaya rambut
        type: select
        default: Lainnya
        options:
          values: [Fade, Pompadour, Crop, Coloring, Perming, Lainnya]
      - name: caption
        label: Keterangan singkat
        type: string
        description: "Opsional, tampil saat foto diperbesar."
        options:
          maxlength: 120
      - name: order
        label: Urutan
        type: number
        default: 0
        options:
          min: 0
      - name: isActive
        label: Tampilkan di website
        type: boolean
        default: true

  # ------------------------------------------------------------------ Promo
  - name: promos
    label: Promo
    type: file
    path: src/content/promos.json
    format: json
    list: true
    fields:
      - name: title
        label: Judul promo
        type: string
        required: true
        description: "Contoh: Diskon 20% Haircut Weekday"
        options:
          maxlength: 80
      - name: description
        label: Deskripsi
        type: text
        description: "Syarat & ketentuan singkat."
      - name: image
        label: Gambar
        type: image
        description: "Opsional. Gambar lebar (16:10) paling bagus."
        options:
          media: promos
      - name: ctaLabel
        label: Teks tombol
        type: string
        default: Ambil Promo
        options:
          maxlength: 40
      - name: waMessage
        label: Pesan WhatsApp
        type: text
        description: "Pesan otomatis saat tombol diklik. Boleh pakai {brand} dan {promo}. Contoh: Halo {brand}, saya mau pakai promo {promo} untuk [hari/jam]."
      - name: startDate
        label: Mulai
        type: date
        required: true
        description: "Tanggal & jam mulai (WIB)."
        options:
          time: true
          format: "yyyy-MM-dd'T'HH:mm"
      - name: endDate
        label: Selesai
        type: date
        required: true
        description: "Harus setelah tanggal mulai. Promo hilang otomatis setelah waktu ini (WIB)."
        options:
          time: true
          format: "yyyy-MM-dd'T'HH:mm"
      - name: branchSlugs
        label: Berlaku di cabang
        type: select
        description: "Kosongkan = berlaku di SEMUA cabang. Pilih satu atau beberapa bila khusus cabang tertentu."
        options:
          multiple: true
          # @branch-options-start (diisi otomatis dari branches.json oleh scripts/sync-pages-config.mjs)
          values:
            - name: "bogor-bantarjati"
              label: "Bogor Bantarjati"
            - name: "cibubur"
              label: "Cibubur"
          # @branch-options-end
      - name: isActive
        label: Aktif
        type: boolean
        default: true
        description: "Matikan untuk menghentikan promo lebih cepat."

  # ------------------------------------------------------------------ Pengumuman
  - name: announcements
    label: Pengumuman
    type: file
    path: src/content/announcements.json
    format: json
    list: true
    fields:
      - name: message
        label: Pesan
        type: string
        required: true
        description: "Maks. 160 karakter. Tampil sebagai bar tipis di atas menu."
        options:
          maxlength: 160
      - name: type
        label: Jenis
        type: select
        required: true
        default: Info
        description: '"Tutup" tampil paling menonjol.'
        options:
          values: [Info, Tutup, Jam Khusus]
      - name: startDate
        label: Mulai tampil
        type: date
        default: ""
        description: "Opsional (WIB). Kosong = langsung tampil."
        options:
          time: true
          format: "yyyy-MM-dd'T'HH:mm"
      - name: endDate
        label: Selesai tampil
        type: date
        default: ""
        description: "Opsional (WIB). Kosong = tampil sampai dimatikan."
        options:
          time: true
          format: "yyyy-MM-dd'T'HH:mm"
      - name: branchSlugs
        label: Berlaku di cabang
        type: select
        description: "Kosongkan = tampil di SEMUA cabang. Pengumuman jenis Tutup atau Jam Khusus mengubah status buka cabang yang dipilih. Pilih satu atau beberapa bila khusus cabang tertentu."
        options:
          multiple: true
          # @branch-options-start (diisi otomatis dari branches.json oleh scripts/sync-pages-config.mjs)
          values:
            - name: "bogor-bantarjati"
              label: "Bogor Bantarjati"
            - name: "cibubur"
              label: "Cibubur"
          # @branch-options-end
      - name: isActive
        label: Aktif
        type: boolean
        default: true

  # ------------------------------------------------------------------ Testimoni
  - name: testimonials
    label: Testimoni
    type: file
    path: src/content/testimonials.json
    format: json
    list: true
    fields:
      - name: author
        label: Nama pemberi ulasan
        type: string
        required: true
        description: "Tulis seperti di Google, mis. Aditya R."
        options:
          maxlength: 60
      - name: rating
        label: Bintang (1–5)
        type: number
        required: true
        default: 5
        options:
          min: 1
          max: 5
      - name: text
        label: Isi ulasan
        type: text
        required: true
        description: "Salin dari ulasan asli (maks. 500 karakter). Jangan mengarang ulasan."
      - name: date
        label: Tanggal ulasan
        type: date
        default: ""
        description: "Opsional. Ditampilkan sebagai '2 minggu lalu' dsb."
      - name: source
        label: Sumber
        type: select
        default: Google
        options:
          values: [Google, Instagram, TikTok, Langsung]
      - name: order
        label: Urutan
        type: number
        default: 0
        options:
          min: 0
      - name: isActive
        label: Tampilkan di website
        type: boolean
        default: true

  # ------------------------------------------------------------------ Produk
  - name: products
    label: Produk
    type: file
    path: src/content/products.json
    format: json
    list: true
    fields:
      - name: name
        label: Nama produk
        type: string
        required: true
        description: "Contoh: Water Based Pomade"
        options:
          maxlength: 80
      - name: category
        label: Kategori
        type: select
        required: true
        default: Pomade
        options:
          values: [Pomade, Hair Clay, Hair Powder, Hair Tonic, Hair Spray, Shampoo & Conditioner, Beard Care, Aksesoris, Lainnya]
      - name: price
        label: Harga jual (Rupiah)
        type: number
        required: true
        description: "Angka saja, tanpa titik dan tanpa Rp. Contoh: 95000"
        options:
          min: 0
      - name: compareAtPrice
        label: Harga coret (opsional)
        type: number
        description: "Harga sebelum diskon, tampil dicoret. Harus lebih besar dari harga jual. Kosongkan bila tidak diskon."
        options:
          min: 0
      - name: size
        label: Isi / ukuran
        type: string
        description: "Contoh: 100 ml atau 80 gr"
        options:
          maxlength: 30
      - name: description
        label: Deskripsi singkat
        type: text
        description: "Manfaat & cocok untuk siapa (maks. 400 karakter)."
      - name: image
        label: Foto produk
        type: image
        description: "Foto persegi (1:1), latar polos. Dikompres otomatis ke WebP maks. 1000 px. Kosong = gambar logo."
        options:
          media: products
      - name: badge
        label: Label khusus
        type: select
        description: "Opsional. Kosongkan bila tidak perlu."
        options:
          values: [Best Seller, Baru, Promo]
      - name: inStock
        label: Stok tersedia
        type: boolean
        default: true
        description: "Matikan bila stok habis: produk tetap tampil dengan label Stok habis dan tombol Tanya stok."
      - name: shopeeUrl
        label: Link Shopee (opsional)
        type: string
        pattern:
          regex: "^(https?://.+)?$"
          message: Harus diawali https://
      - name: tokopediaUrl
        label: Link Tokopedia (opsional)
        type: string
        pattern:
          regex: "^(https?://.+)?$"
          message: Harus diawali https://
      - name: order
        label: Urutan
        type: number
        default: 0
        description: "Angka kecil tampil lebih dulu (10, 20, 30, ...)."
        options:
          min: 0
      - name: isActive
        label: Tampilkan di website
        type: boolean
        default: true
        description: "Matikan untuk menyembunyikan tanpa menghapus."

  # ------------------------------------------------------------------ Pengaturan Situs
  - name: settings
    label: Pengaturan Situs
    type: file
    path: src/content/settings.json
    format: json
    fields:
      - name: logo
        label: Logo footer
        type: image
        description: "PNG/WebP transparan, versi putih."
        options:
          media: site
      - name: siteName
        label: Nama usaha
        type: string
        required: true
        options:
          maxlength: 80
      - name: siteUrl
        label: Alamat website (domain resmi)
        type: string
        required: true
        description: "Mis. https://cutlesshairstudio.id (tanpa garis miring di akhir). Satu-satunya sumber domain untuk Google, sitemap, dan preview link."
        pattern:
          regex: "^https://[^\\s]+[^/]$"
          message: Diawali https:// dan tanpa garis miring di akhir
      - name: mainWhatsappNumber
        label: Nomor WhatsApp pusat
        type: string
        required: true
        description: "Untuk pertanyaan umum (footer). Booking memakai nomor WhatsApp masing-masing cabang. Format 628xxxxxxxxxx."
        pattern:
          regex: "^62\\d{8,13}$"
          message: Format harus 628xxxxxxxxxx (tanpa +, spasi, atau strip)
      - name: defaultWaMessage
        label: Pesan booking default
        type: text
        description: "Boleh pakai {brand} dan {branch} (nama cabang). Contoh: Halo {brand} cabang {branch}, saya mau booking haircut untuk [hari/jam]."
      - name: instagramUrl
        label: Link Instagram
        type: string
        description: "Kosongkan untuk menyembunyikan ikon."
        pattern:
          regex: "^(https?://.+)?$"
          message: Harus diawali https://
      - name: tiktokUrl
        label: Link TikTok
        type: string
        description: "Kosongkan untuk menyembunyikan ikon."
        pattern:
          regex: "^(https?://.+)?$"
          message: Harus diawali https://
      - name: footerText
        label: Teks footer
        type: text
        description: "Kalimat singkat di bawah logo footer."
      - name: stats
        label: Angka statistik
        type: object
        description: "Jumlah cabang & hairstylist dihitung otomatis. Angka di bawah hanya tampil bila tombolnya dinyalakan; isi dengan angka ASLI."
        fields:
          - name: customers
            label: Jumlah pelanggan
            type: number
            options:
              min: 0
          - name: showCustomers
            label: Tampilkan jumlah pelanggan
            type: boolean
            default: false
          - name: foundedYear
            label: Tahun berdiri
            type: number
            options:
              min: 1900
              max: 2100
          - name: showFoundedYear
            label: Tampilkan tahun berdiri
            type: boolean
            default: false
          - name: rating
            label: Rating Google
            type: string
            description: "Mis. 4.9 (sesuai rating di Google Maps)."
            pattern:
              regex: "^([1-4]([.,]\\d)?|5([.,]0)?)?$"
              message: Angka 1–5, mis. 4.9
          - name: showRating
            label: Tampilkan rating
            type: boolean
            default: false
          - name: reviewCount
            label: Jumlah ulasan Google
            type: number
            options:
              min: 0
          - name: showReviewCount
            label: Tampilkan jumlah ulasan
            type: boolean
            default: false
          - name: reviewsUrl
            label: Link halaman ulasan
            type: string
            description: "Untuk tombol Lihat semua ulasan (link Google Maps bisnis)."
            pattern:
              regex: "^(https?://.+)?$"
              message: Harus diawali https://
      - name: showTestimonials
        label: Tampilkan section Testimoni
        type: boolean
        default: false
        description: "Nyalakan setelah ada ulasan asli di menu Testimoni."
      - name: showProducts
        label: Tampilkan Produk
        type: boolean
        default: false
        description: "Nyalakan setelah data produk asli lengkap. Mati = section & menu Produk disembunyikan."
      - name: showBeforeAfter
        label: Tampilkan Before / After
        type: boolean
        default: false
        description: "Nyalakan setelah foto sebelum-sesudah asli tersedia."
      - name: enablePreloader
        label: Tampilkan animasi pembuka
        type: boolean
        default: true
        description: "Logo Cutless beranimasi saat website pertama kali dibuka (sekali per kunjungan, maks. 1,5 detik)."
      - name: preloaderVideo
        label: Video animasi pembuka (opsional)
        type: file
        description: "MP4/WebM tanpa suara, maks. 500 KB dan ±1,5 detik. Kosongkan untuk memakai animasi logo."
        options:
          media: videos
