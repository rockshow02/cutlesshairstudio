# Konfigurasi Pages CMS (https://pagescms.org) untuk website Cutless Hair Studio.
# Admin login di https://app.pagescms.org dengan akun GitHub (harus kolaborator repo ini).
# Setiap "Simpan" = 1 commit ke branch yang dipilih → Cloudflare build & deploy otomatis (±1–2 menit).
#
# Skema field harus sama dengan src/content/schema.ts (validasi Zod saat build).
# Pilihan cabang (blok "@branch-options") disinkronkan otomatis dari src/content/branches.json
# oleh GitHub Actions (npm run sync-cms). Jangan diedit manual.

media:
  - name: branches
    label: Foto Cabang
    input: public/uploads/branches
    output: /uploads/branches
    categories: [image]
    rename: safe
  - name: barbers
    label: Foto Barber
    input: public/uploads/barbers
    output: /uploads/barbers
    categories: [image]
    rename: safe
  - name: gallery
    label: Foto Galeri
    input: public/uploads/gallery
    output: /uploads/gallery
    categories: [image]
    rename: safe
  - name: promos
    label: Gambar Promo
    input: public/uploads/promos
    output: /uploads/promos
    categories: [image]
    rename: safe
  - name: products
    label: Foto Produk
    input: public/uploads/products
    output: /uploads/products
    categories: [image]
    rename: safe
  - name: site
    label: Logo
    input: public/uploads/site
    output: /uploads/site
    categories: [image]
    rename: safe
  - name: hero
    label: Foto Hero
    input: public/uploads/hero
    output: /uploads/hero
    categories: [image]
    rename: safe
  - name: about
    label: Foto Tentang Kami
    input: public/uploads/about
    output: /uploads/about
    categories: [image]
    rename: safe
  - name: studio
    label: Foto Kartu Studio
    input: public/uploads/studio
    output: /uploads/studio
    categories: [image]
    rename: safe
  - name: videos
    label: Video
    input: public/uploads/videos
    output: /uploads/videos
    categories: [video]
    rename: safe

content:
  # ------------------------------------------------------------------ Cabang
  - name: branches
    label: Cabang
    type: file
    path: src/content/branches.json
    format: json
    list: true
    fields:
      - name: slug
        label: Kode URL (slug)
        type: string
        required: true
        description: "Untuk alamat halaman /cabang/<slug>/. Huruf kecil, angka, dan tanda minus, mis. bogor-bantarjati. Jangan diubah setelah tayang. Maksimal 60 karakter."
        pattern:
          regex: "^[a-z0-9]+(-[a-z0-9]+)*$"
          message: Hanya huruf kecil, angka, dan tanda minus (mis. bogor-bantarjati)
        options:
          maxlength: 60
      - name: name
        label: Nama cabang
        type: string
        required: true
        description: "Tanpa nama merek, mis. Bogor Bantarjati. Dipakai di pesan WhatsApp: ...cabang Bogor Bantarjati. Maksimal 60 karakter."
        options:
          maxlength: 60
      - name: city
        label: Kota
        type: string
        required: true
        description: "Dipakai untuk pengelompokan di pemilih cabang, mis. Bogor. Maksimal 60 karakter."
        options:
          maxlength: 60
      - name: province
        label: Provinsi
        type: string
        required: true
        options:
          maxlength: 60
        description: Maksimal 60 karakter.
      - name: address
        label: Alamat lengkap
        type: text
        options:
          maxlength: 300
        description: Maksimal 300 karakter.
      - name: googleMapsUrl
        label: Link Google Maps
        type: string
        description: "Untuk tombol Petunjuk Arah. Buka Google Maps → Bagikan → Salin link."
        pattern:
          regex: "^(https?://.+)?$"
          message: Harus diawali https://
      - name: latitude
        label: Latitude
        type: string
        description: "Untuk fitur Cabang terdekat & peta. Di Google Maps: klik kanan titik lokasi → klik angka koordinat (angka pertama), mis. -6.5761"
        pattern:
          regex: "^(-?\\d{1,2}([.,]\\d+)?)?$"
          message: Angka desimal, mis. -6.5761
      - name: longitude
        label: Longitude
        type: string
        description: "Angka kedua dari koordinat Google Maps, mis. 106.8062"
        pattern:
          regex: "^(-?\\d{1,3}([.,]\\d+)?)?$"
          message: Angka desimal, mis. 106.8062
      - name: whatsappNumber
        label: Nomor WhatsApp cabang
        type: string
        required: true
        description: "Semua tombol booking cabang ini. Format 628xxxxxxxxxx, contoh 6281234567890."
        pattern:
          regex: "^(62\\d{8,13}|TODO.*)$"
          message: Format harus 628xxxxxxxxxx (tanpa +, spasi, atau strip)
      - name: timezone
        label: Zona waktu
        type: select
        default: Asia/Jakarta
        description: "WIB = Asia/Jakarta, WITA = Asia/Makassar, WIT = Asia/Jayapura. Dipakai menghitung status buka."
        options:
          values: [Asia/Jakarta, Asia/Makassar, Asia/Jayapura]
      - name: openingHours
        label: Jam buka
        type: object
        description: "Satu baris per hari, urut Senin–Minggu. Format jam 24 jam, mis. 10:00."
        list:
          max: 7
          collapsible:
            collapsed: true
            summary: "{day}: {openTime}–{closeTime}"
        fields:
          - name: day
            label: Hari
            type: select
            required: true
            options:
              values: [Senin, Selasa, Rabu, Kamis, Jumat, Sabtu, Minggu]
          - name: openTime
            label: Jam buka
            type: string
            pattern:
              regex: "^(([01]\\d|2[0-3]):[0-5]\\d)?$"
              message: Format HH:MM, contoh 10:00
          - name: closeTime
            label: Jam tutup
            type: string
            pattern:
              regex: "^(([01]\\d|2[0-3]):[0-5]\\d)?$"
              message: Format HH:MM, contoh 21:00
          - name: isClosed
            label: Tutup seharian
            type: boolean
            default: false
      - name: status
        label: Status
        type: select
        default: Aktif
        description: "Segera Dibuka & Tutup Sementara tampil dengan label dan TANPA tombol booking."
        options:
          values: [Aktif, Segera Dibuka, Tutup Sementara]
      - name: photo
        label: Foto cabang
        type: image
        description: "Foto studio/fasad, lebar (landscape). Dikompres otomatis ke WebP."
        options:
          media: branches
      - name: order
        label: Urutan
        type: number
        default: 0
        description: "Angka kecil tampil lebih dulu (10, 20, 30, ...)."
        options:
          min: 0

  # ------------------------------------------------------------------ Daftar Harga
  - name: pricing
    label: Daftar Harga
    type: file
    path: src/content/pricing.json
    format: json
    list: true
    fields:
      - name: name
        label: Nama layanan
        type: string
        required: true
        description: "Contoh: Signature Haircut. Maksimal 80 karakter."
        options:
          maxlength: 80
      - name: category
        label: Kategori
        type: select
        required: true
        default: Haircut & Grooming
        description: "Pilih \"Paket\" untuk paket/membership (tampil sebagai kartu)."
        options:
          values: [Haircut & Grooming, Wanita, Treatment, Coloring, Perming, Braids & Dreadlock, Shaving, Kids, Paket]
      - name: price
        label: Harga (Rupiah)
        type: number
        required: true
        description: "Angka saja, tanpa titik dan tanpa \"Rp\". Contoh: 75000"
        options:
          min: 0
      - name: priceFrom
        label: Harga mulai
        type: boolean
        default: false
        description: "Aktifkan bila harga bisa lebih tinggi (tampil \"mulai Rp ...\")."
      - name: description
        label: Keterangan
        type: text
        description: "Opsional. Untuk kategori Paket, tulis isi paket satu baris per poin. Maksimal 300 karakter."
        options:
          maxlength: 300
      - name: badge
        label: Label khusus
        type: select
        description: "Opsional. Kosongkan bila tidak perlu."
        options:
          values: [Best Seller, Baru, Promo]
      - name: branchPrices
        label: Harga khusus cabang
        type: object
        description: "Opsional. Kosongkan bila harga sama di semua cabang. Isi hanya untuk cabang yang harganya berbeda."
        list:
          collapsible:
            collapsed: true
            summary: "{branchSlug}: {price}"
        fields:
          - name: branchSlug
            label: Cabang
            type: select
            required: true
            options:
              # @branch-options-start (diisi otomatis dari branches.json oleh scripts/sync-pages-config.mjs)
              values:
                - name: "bogor-bantarjati"
                  label: "Bogor Bantarjati"
                - name: "cibubur"
                  label: "Cibubur"
              # @branch-options-end
          - name: price
            label: Harga di cabang ini (Rupiah)
            type: number
            required: true
            options:
              min: 0
      - name: order
        label: Urutan
        type: number
        default: 0
        description: "Angka kecil tampil lebih dulu (10, 20, 30, ...)."
        options:
          min: 0
      - name: isActive
        label: Tampilkan di website
        type: boolean
        default: true
        description: "Matikan untuk menyembunyikan tanpa menghapus."

  # ------------------------------------------------------------------ Barber
  - name: barbers
    label: Barber
    type: file
    path: src/content/barbers.json
    format: json
    list: true
    fields:
      - name: name
        label: Nama panggilan
        type: string
        required: true
        options:
          maxlength: 60
        description: Maksimal 60 karakter.
      - name: role
        label: Jabatan
        type: string
        description: "Opsional, mis. Head Hairstylist. Maksimal 60 karakter."
        options:
          maxlength: 60
      - name: photo
        label: Foto
        type: image
        required: true
        description: "Foto potret (tegak), wajah jelas. Otomatis dikompres ke WebP maks. 800 px."
        options:
          media: barbers
      - name: branchSlug
        label: Cabang
        type: select
        required: true
        description: "Cabang tempat barber bekerja. Tombol booking barber menuju WhatsApp cabang ini."
        options:
          # @branch-options-start (diisi otomatis dari branches.json oleh scripts/sync-pages-config.mjs)
          values:
            - name: "bogor-bantarjati"
              label: "Bogor Bantarjati"
            - name: "cibubur"
              label: "Cibubur"
          # @branch-options-end
      - name: specialty
        label: Spesialisasi
        type: string
        description: "Pisahkan dengan koma. Contoh: Skin fade, Pompadour. Maksimal 120 karakter."
        options:
          maxlength: 120
      - name: whatsappNumber
        label: WhatsApp pribadi
        type: string
        description: "Opsional, format 628xxxxxxxxxx (tanpa +, spasi, strip). Kosong = pakai nomor WhatsApp cabangnya."
        pattern:
          regex: "^(62\\d{8,13})?$"
          message: Format harus 628xxxxxxxxxx, contoh 6281234567890
      - name: instagram
        label: Link Instagram
        type: string
        description: "Opsional, link lengkap. Contoh: https://instagram.com/namabarber"
        pattern:
          regex: "^(https?://.+)?$"
          message: Harus diawali https://
      - name: order
        label: Urutan
        type: number
        default: 0
        description: "Posisi tampil (angka kecil = paling kiri)."
        options:
          min: 0
      - name: isActive
        label: Tampilkan di website
        type: boolean
        default: true
        description: "Matikan bila barber cuti/resign, tanpa menghapus data."

  # ------------------------------------------------------------------ Galeri
  - name: gallery
    label: Galeri
    type: file
    path: src/content/gallery.json
    format: json
    list: true
    fields:
      - name: image
        label: Foto
        type: image
        required: true
        description: "Foto tegak tampil tinggi, foto lebar tampil lebar (otomatis). Dikompres ke WebP maks. 1600 px."
        options:
          media: gallery
      - name: altText
        label: Deskripsi foto
        type: string
        required: true
        description: "Wajib. Jelaskan isi foto, mis. \"Mid fade dengan textured crop\". Maksimal 150 karakter."
        options:
          maxlength: 150
      - name: styleCategory
        label: Gaya rambut
        type: select
        default: Lainnya
        options:
          values: [Fade, Pompadour, Crop, Coloring, Perming, Lainnya]
      - name: caption
        label: Keterangan singkat
        type: string
        description: "Opsional, tampil saat foto diperbesar dan sebagai label di kolom foto berjalan (section Lokasi). Kosong = label memakai Gaya rambut. Maksimal 120 karakter."
        options:
          maxlength: 120
      - name: focalPoint
        label: Titik fokus
        type: select
        default: atas
        description: "Bagian foto yang dipertahankan saat foto dipotong agar pas di kartu: atas (kepala/wajah), tengah, atau bawah."
        options:
          values: [atas, tengah, bawah]
      - name: showInMarquee
        label: Tampilkan di kolom foto berjalan
        type: boolean
        default: true
        description: "Ikut berjalan di kolom foto section Lokasi. Matikan untuk foto yang hanya untuk galeri."
      - name: order
        label: Urutan
        type: number
        default: 0
        options:
          min: 0
      - name: isActive
        label: Tampilkan di website
        type: boolean
        default: true

  # ------------------------------------------------------------------ Hero
  - name: hero
    label: Hero (bagian paling atas)
    type: file
    path: src/content/hero.json
    format: json
    fields:
      - name: kicker
        label: Teks kecil di atas judul
        type: string
        required: true
        description: "{cities} diganti otomatis dengan kota cabang, mis. Hair Studio · {cities} → Hair Studio · Bogor & Cibubur. Maksimal 80 karakter."
        options:
          maxlength: 80
      - name: titleLines
        label: Judul (per baris)
        type: string
        list:
          min: 1
          max: 3
        required: true
        description: "Satu isian = satu baris judul besar. Pendek saja. Maksimal 40 karakter per isian."
        options:
          maxlength: 40
      - name: subtitle
        label: Subjudul
        type: text
        required: true
        description: "1–2 kalimat. Maksimal 240 karakter."
        options:
          maxlength: 240
      - name: primaryCtaLabel
        label: Label tombol utama
        type: string
        required: true
        description: "Tombol ini membuka WhatsApp cabang yang dipilih. Contoh: Booking via WhatsApp. Maksimal 30 karakter."
        options:
          maxlength: 30
      - name: secondaryCtaLabel
        label: Label tombol kedua
        type: string
        required: true
        description: "Menuju daftar layanan. Contoh: Lihat Layanan. Maksimal 30 karakter."
        options:
          maxlength: 30
      - name: image
        label: Foto desktop
        type: image
        required: true
        description: "Foto lebar (landscape), min. 1920 px. Dikompres otomatis ke WebP 1920 px + versi 1280 px."
        options:
          media: hero
      - name: mobileImage
        label: Foto HP (opsional)
        type: image
        description: "Foto tegak (portrait) untuk layar HP. Kosong = memakai foto desktop."
        options:
          media: hero
      - name: imageAlt
        label: Deskripsi foto
        type: string
        required: true
        description: "Wajib. Jelaskan isi foto untuk pembaca layar & Google. Maksimal 150 karakter."
        options:
          maxlength: 150
      - name: marquee
        label: Teks berjalan
        type: string
        list:
          min: 1
          max: 8
        required: true
        description: "Kata-kata pendek di strip berjalan di bawah hero. Maksimal 40 karakter per isian."
        options:
          maxlength: 40

  # ------------------------------------------------------------------ Tentang Kami
  - name: about
    label: Tentang Kami
    type: file
    path: src/content/about.json
    format: json
    fields:
      - name: kicker
        label: Teks kecil di atas judul
        type: string
        required: true
        options:
          maxlength: 40
        description: Maksimal 40 karakter.
      - name: title
        label: Judul (tampil di atas foto)
        type: string
        required: true
        options:
          maxlength: 80
        description: Maksimal 80 karakter.
      - name: paragraphs
        label: Paragraf
        type: text
        list:
          min: 1
          max: 4
        required: true
        description: "Paragraf pertama tampil lebih besar. Maksimal 600 karakter per isian."
        options:
          maxlength: 600
      - name: values
        label: Poin nilai
        type: object
        list:
          max: 6
        description: "Daftar bertanda centang di samping foto."
        fields:
          - name: title
            label: Judul poin
            type: string
            required: true
            options:
              maxlength: 40
            description: Maksimal 40 karakter.
          - name: description
            label: Keterangan
            type: string
            required: true
            options:
              maxlength: 120
            description: Maksimal 120 karakter.
      - name: caption
        label: Keterangan di bawah foto
        type: string
        description: "Contoh: Studio Cutless, Bogor. Maksimal 80 karakter."
        options:
          maxlength: 80
      - name: images
        label: Foto slideshow
        type: object
        list:
          min: 1
          max: 8
        required: true
        description: "1–8 foto tegak (portrait 4:5). Urutan di sini = urutan tampil; foto pertama dimuat lebih dulu. Satu foto = tampil diam tanpa indikator. Dikompres otomatis ke WebP 1200 px + versi HP 600 px."
        fields:
          - name: src
            label: Foto
            type: image
            required: true
            options:
              media: about
          - name: alt
            label: Deskripsi foto
            type: string
            required: true
            description: "Wajib. Jelaskan isi foto, mis. Hairstylist merapikan fade pelanggan. Maksimal 150 karakter."
            options:
              maxlength: 150
          - name: focalPoint
            label: Titik fokus
            type: select
            default: tengah
            description: "Bagian foto yang dipertahankan saat foto dipotong agar pas bingkai (mis. atas untuk wajah)."
            options:
              values: [atas, tengah, bawah]
      - name: slideInterval
        label: Jeda per foto (detik)
        type: number
        default: 5
        options:
          min: 3
          max: 15
      - name: transition
        label: Efek pergantian
        type: select
        default: crossfade
        description: "crossfade = memudar halus; ken-burns = memudar + foto membesar perlahan."
        options:
          values: [crossfade, ken-burns]

  # ------------------------------------------------------------------ Kartu Studio
  - name: studio
    label: Kartu Studio ("On point, always.")
    type: file
    path: src/content/studio.json
    format: json
    fields:
      - name: image
        label: Foto
        type: image
        description: "Foto lebar suasana studio. Kosong = memakai foto cabang pertama."
        options:
          media: studio
      - name: imageAlt
        label: Deskripsi foto
        type: string
        description: "Wajib bila foto diisi. Maksimal 150 karakter."
        options:
          maxlength: 150
      - name: taglines
        label: Tagline
        type: string
        list:
          min: 1
          max: 5
        required: true
        description: "Kalimat pendek yang berganti di atas foto. Maksimal 60 karakter per isian."
        options:
          maxlength: 60

  # ------------------------------------------------------------------ Promo
  - name: promos
    label: Promo
    type: file
    path: src/content/promos.json
    format: json
    list: true
    fields:
      - name: title
        label: Judul promo
        type: string
        required: true
        description: "Contoh: Diskon 20% Haircut Weekday. Maksimal 80 karakter."
        options:
          maxlength: 80
      - name: description
        label: Deskripsi
        type: text
        description: "Syarat & ketentuan singkat. Maksimal 400 karakter."
        options:
          maxlength: 400
      - name: image
        label: Gambar
        type: image
        description: "Opsional. Gambar lebar (16:10) paling bagus."
        options:
          media: promos
      - name: ctaLabel
        label: Teks tombol
        type: string
        default: Ambil Promo
        options:
          maxlength: 40
        description: Maksimal 40 karakter.
      - name: waMessage
        label: Pesan WhatsApp
        type: text
        description: "Pesan otomatis saat tombol diklik. Boleh pakai {brand} dan {promo}. Contoh: Halo {brand}, saya mau pakai promo {promo} untuk [hari/jam]. Maksimal 500 karakter."
        options:
          maxlength: 500
      - name: startDate
        label: Mulai
        type: date
        required: true
        description: "Tanggal & jam mulai (WIB)."
        options:
          time: true
          format: "yyyy-MM-dd'T'HH:mm"
      - name: endDate
        label: Selesai
        type: date
        required: true
        description: "Harus setelah tanggal mulai. Promo hilang otomatis setelah waktu ini (WIB)."
        options:
          time: true
          format: "yyyy-MM-dd'T'HH:mm"
      - name: branchSlugs
        label: Berlaku di cabang
        type: select
        description: "Kosongkan = berlaku di SEMUA cabang. Pilih satu atau beberapa bila khusus cabang tertentu."
        options:
          multiple: true
          # @branch-options-start (diisi otomatis dari branches.json oleh scripts/sync-pages-config.mjs)
          values:
            - name: "bogor-bantarjati"
              label: "Bogor Bantarjati"
            - name: "cibubur"
              label: "Cibubur"
          # @branch-options-end
      - name: isActive
        label: Aktif
        type: boolean
        default: true
        description: "Matikan untuk menghentikan promo lebih cepat."

  # ------------------------------------------------------------------ Pengumuman
  - name: announcements
    label: Pengumuman
    type: file
    path: src/content/announcements.json
    format: json
    list: true
    fields:
      - name: message
        label: Pesan
        type: string
        required: true
        description: "Tampil sebagai bar tipis di atas menu. Maksimal 160 karakter."
        options:
          maxlength: 160
      - name: type
        label: Jenis
        type: select
        default: Info
        description: '"Tutup" tampil paling menonjol.'
        options:
          values: [Info, Tutup, Jam Khusus]
      - name: startDate
        label: Mulai tampil
        type: date
        default: ""
        description: "Opsional (WIB). Kosong = langsung tampil."
        options:
          time: true
          format: "yyyy-MM-dd'T'HH:mm"
      - name: endDate
        label: Selesai tampil
        type: date
        default: ""
        description: "Opsional (WIB). Kosong = tampil sampai dimatikan."
        options:
          time: true
          format: "yyyy-MM-dd'T'HH:mm"
      - name: branchSlugs
        label: Berlaku di cabang
        type: select
        description: "Kosongkan = tampil di SEMUA cabang. Pengumuman jenis Tutup atau Jam Khusus mengubah status buka cabang yang dipilih. Pilih satu atau beberapa bila khusus cabang tertentu."
        options:
          multiple: true
          # @branch-options-start (diisi otomatis dari branches.json oleh scripts/sync-pages-config.mjs)
          values:
            - name: "bogor-bantarjati"
              label: "Bogor Bantarjati"
            - name: "cibubur"
              label: "Cibubur"
          # @branch-options-end
      - name: isActive
        label: Aktif
        type: boolean
        default: true

  # ------------------------------------------------------------------ Testimoni
  - name: testimonials
    label: Testimoni
    type: file
    path: src/content/testimonials.json
    format: json
    list: true
    fields:
      - name: author
        label: Nama pemberi ulasan
        type: string
        required: true
        description: "Tulis seperti di Google, mis. Aditya R. Maksimal 60 karakter."
        options:
          maxlength: 60
      - name: rating
        label: Bintang (1–5)
        type: number
        required: true
        default: 5
        options:
          min: 1
          max: 5
      - name: text
        label: Isi ulasan
        type: text
        required: true
        description: "Salin dari ulasan asli. Jangan mengarang ulasan. Maksimal 500 karakter."
        options:
          maxlength: 500
      - name: date
        label: Tanggal ulasan
        type: date
        default: ""
        description: "Opsional. Ditampilkan sebagai '2 minggu lalu' dsb."
      - name: source
        label: Sumber
        type: select
        default: Google
        options:
          values: [Google, Instagram, TikTok, Langsung]
      - name: order
        label: Urutan
        type: number
        default: 0
        options:
          min: 0
      - name: isActive
        label: Tampilkan di website
        type: boolean
        default: true

  # ------------------------------------------------------------------ Produk
  - name: products
    label: Produk
    type: file
    path: src/content/products.json
    format: json
    list: true
    fields:
      - name: name
        label: Nama produk
        type: string
        required: true
        description: "Contoh: Water Based Pomade. Maksimal 80 karakter."
        options:
          maxlength: 80
      - name: category
        label: Kategori
        type: select
        required: true
        default: Pomade
        options:
          values: [Pomade, Hair Clay, Hair Powder, Hair Tonic, Hair Spray, Shampoo & Conditioner, Beard Care, Aksesoris, Lainnya]
      - name: price
        label: Harga jual (Rupiah)
        type: number
        required: true
        description: "Angka saja, tanpa titik dan tanpa Rp. Contoh: 95000"
        options:
          min: 0
      - name: compareAtPrice
        label: Harga coret (opsional)
        type: number
        description: "Harga sebelum diskon, tampil dicoret. Harus lebih besar dari harga jual. Kosongkan bila tidak diskon."
        options:
          min: 0
      - name: size
        label: Isi / ukuran
        type: string
        description: "Contoh: 100 ml atau 80 gr. Maksimal 30 karakter."
        options:
          maxlength: 30
      - name: description
        label: Deskripsi singkat
        type: text
        description: "Manfaat & cocok untuk siapa. Maksimal 400 karakter."
        options:
          maxlength: 400
      - name: image
        label: Foto produk
        type: image
        description: "Foto persegi (1:1), latar polos. Dikompres otomatis ke WebP maks. 1000 px. Kosong = gambar logo."
        options:
          media: products
      - name: badge
        label: Label khusus
        type: select
        description: "Opsional. Kosongkan bila tidak perlu."
        options:
          values: [Best Seller, Baru, Promo]
      - name: inStock
        label: Stok tersedia
        type: boolean
        default: true
        description: "Matikan bila stok habis: produk tetap tampil dengan label Stok habis dan tombol Tanya stok."
      - name: shopeeUrl
        label: Link Shopee (opsional)
        type: string
        pattern:
          regex: "^(https?://.+)?$"
          message: Harus diawali https://
      - name: tokopediaUrl
        label: Link Tokopedia (opsional)
        type: string
        pattern:
          regex: "^(https?://.+)?$"
          message: Harus diawali https://
      - name: order
        label: Urutan
        type: number
        default: 0
        description: "Angka kecil tampil lebih dulu (10, 20, 30, ...)."
        options:
          min: 0
      - name: isActive
        label: Tampilkan di website
        type: boolean
        default: true
        description: "Matikan untuk menyembunyikan tanpa menghapus."

  # ------------------------------------------------------------------ Pengaturan Situs
  - name: settings
    label: Pengaturan Situs
    type: file
    path: src/content/settings.json
    format: json
    fields:
      - name: logo
        label: Logo footer
        type: image
        description: "PNG/WebP transparan, versi putih."
        options:
          media: site
      - name: siteName
        label: Nama usaha
        type: string
        required: true
        options:
          maxlength: 80
        description: Maksimal 80 karakter.
      - name: siteUrl
        label: Alamat website (domain resmi)
        type: string
        required: true
        description: "Mis. https://cutlesshairstudio.id (tanpa garis miring di akhir). Satu-satunya sumber domain untuk Google, sitemap, dan preview link."
        pattern:
          regex: "^https://[^\\s]+[^/]$"
          message: Diawali https:// dan tanpa garis miring di akhir
      - name: mainWhatsappNumber
        label: Nomor WhatsApp pusat
        type: string
        required: true
        description: "Untuk pertanyaan umum (footer). Booking memakai nomor WhatsApp masing-masing cabang. Format 628xxxxxxxxxx."
        pattern:
          regex: "^62\\d{8,13}$"
          message: Format harus 628xxxxxxxxxx (tanpa +, spasi, atau strip)
      - name: defaultWaMessage
        label: Pesan booking default
        type: text
        description: "Boleh pakai {brand} dan {branch} (nama cabang). Contoh: Halo {brand} cabang {branch}, saya mau booking haircut untuk [hari/jam]. Maksimal 500 karakter."
        options:
          maxlength: 500
      - name: instagramUrl
        label: Link Instagram
        type: string
        description: "Kosongkan untuk menyembunyikan ikon."
        pattern:
          regex: "^(https?://.+)?$"
          message: Harus diawali https://
      - name: tiktokUrl
        label: Link TikTok
        type: string
        description: "Kosongkan untuk menyembunyikan ikon."
        pattern:
          regex: "^(https?://.+)?$"
          message: Harus diawali https://
      - name: email
        label: Email
        type: string
        description: "Opsional, tampil di footer. Kosongkan untuk menyembunyikan baris email. Maksimal 100 karakter."
        pattern:
          regex: '^([^@\s]+@[^@\s]+\.[^@\s]+)?$'
          message: Format email tidak valid, mis. halo@cutlesshairstudio.id
        options:
          maxlength: 100
      - name: footerTagline
        label: Tagline footer
        type: text
        default: "Hair studio di {cities}. Goodstyle, goodmood."
        description: "Kalimat singkat di bawah logo footer. {cities} diganti otomatis dengan kota cabang aktif, mis. Bogor & Cibubur. Maksimal 160 karakter."
        options:
          maxlength: 160
      - name: stats
        label: Angka statistik
        type: object
        description: "Jumlah cabang & hairstylist dihitung otomatis. Angka di bawah hanya tampil bila tombolnya dinyalakan; isi dengan angka ASLI."
        fields:
          - name: customers
            label: Jumlah pelanggan
            type: number
            options:
              min: 0
          - name: showCustomers
            label: Tampilkan jumlah pelanggan
            type: boolean
            default: false
          - name: foundedYear
            label: Tahun berdiri
            type: number
            options:
              min: 1900
              max: 2100
          - name: showFoundedYear
            label: Tampilkan tahun berdiri
            type: boolean
            default: false
          - name: rating
            label: Rating Google
            type: string
            description: "Mis. 4.9 (sesuai rating di Google Maps)."
            pattern:
              regex: "^([1-4]([.,]\\d)?|5([.,]0)?)?$"
              message: Angka 1–5, mis. 4.9
          - name: showRating
            label: Tampilkan rating
            type: boolean
            default: false
          - name: reviewCount
            label: Jumlah ulasan Google
            type: number
            options:
              min: 0
          - name: showReviewCount
            label: Tampilkan jumlah ulasan
            type: boolean
            default: false
          - name: reviewsUrl
            label: Link halaman ulasan
            type: string
            description: "Untuk tombol Lihat semua ulasan (link Google Maps bisnis)."
            pattern:
              regex: "^(https?://.+)?$"
              message: Harus diawali https://
      - name: showTestimonials
        label: Tampilkan section Testimoni
        type: boolean
        default: false
        description: "Nyalakan setelah ada ulasan asli di menu Testimoni."
      - name: showProducts
        label: Tampilkan Produk
        type: boolean
        default: false
        description: "Nyalakan setelah data produk asli lengkap. Mati = section & menu Produk disembunyikan."
      - name: showBeforeAfter
        label: Tampilkan Before / After
        type: boolean
        default: false
        description: "Nyalakan setelah foto sebelum-sesudah asli tersedia."
      - name: enablePreloader
        label: Tampilkan animasi pembuka
        type: boolean
        default: true
        description: "Logo Cutless beranimasi saat website pertama kali dibuka (sekali per kunjungan, maks. 1,5 detik)."
      - name: preloaderVideo
        label: Video animasi pembuka (opsional)
        type: file
        description: "MP4/WebM tanpa suara, maks. 500 KB dan ±1,5 detik. Kosongkan untuk memakai animasi logo."
        options:
          media: videos
