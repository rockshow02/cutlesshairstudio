            label: Nama layanan
            type: string
            required: true
            description: "Dipakai di pesan WhatsApp ({service}). Maksimal 40 karakter."
            options:
              maxlength: 40
          - name: description
            label: Deskripsi
            type: string
            description: "Opsional. Maksimal 120 karakter."
            options:
              maxlength: 120
          - name: price
            label: Harga
            type: string
            description: "Opsional, format seperti Daftar Harga: angka + K, mis. 45K, 100K, atau rentang 70–120K. Kosong = tampil Lihat di daftar menu. Maksimal 20 karakter."
            pattern:
              regex: '^((\d{1,4}(,\d)?\s?[–-]\s?)?\d{1,4}(,\d)?[Kk])?$'
              message: "Format harga: angka + K, mis. 45K atau 70–120K"
            options:
              maxlength: 20
          - name: estimate
            label: Estimasi waktu
            type: string
            description: "Opsional, mis. ±2 hari atau ±30 menit. Maksimal 30 karakter."
            options:
              maxlength: 30
          - name: icon
            label: Ikon (opsional)
            type: select
            description: "Tampil di kartu bila foto kosong. check = centang, clock = jam, star = bintang, tag = label, wash = tetes air, spa = daun, gift = hadiah, pin = lokasi, calendar = kalender, user = orang, info = info, scissors = gunting."
            options:
              values: [check, clock, star, tag, wash, spa, gift, pin, calendar, user, info, scissors]
          - name: image
            label: Foto (opsional)
            type: image
            description: "Opsional. Foto kecil di kartu layanan (menggantikan ikon), 4:3 minimal 1200 × 900 px. Kompres di bawah 1 MB sebelum upload. Format: JPG, PNG, atau WebP."
            options:
              media: shoe-care
              extensions: [jpg, jpeg, png, webp]
          - name: isActive
            label: Tampilkan
            type: boolean
            default: true
          - name: order
            label: Urutan
            type: number
            default: 0
            description: "Angka kecil tampil lebih dulu."
            options:
              min: 0
      - name: photos
        label: Foto hasil (opsional)
        type: object
        list:
          max: 8
        description: "0–8 foto hasil kerja partner (dengan izin partner). Galeri hanya tampil bila ada foto. Dikompres otomatis ke WebP 1200 px + versi HP 600 px."
        fields:
          - name: image
            label: Foto
            type: image
            description: "Foto hasil kerja partner, 4:3 minimal 1200 × 900 px (bukan logo atau poster promosi). Kompres di bawah 1 MB sebelum upload. Format: JPG, PNG, atau WebP."
            required: true
            options:
              media: shoe-care
              extensions: [jpg, jpeg, png, webp]
          - name: alt
            label: Deskripsi foto
            type: string
            required: true
            description: "Jelaskan isi foto, mis. Sneakers putih sebelum dan sesudah dicuci. Maksimal 150 karakter."
            options:
              maxlength: 150
      - name: notes
        label: Catatan / ketentuan
        type: string
        list:
          max: 10
        description: "Teks kecil di bawah layanan, mis. durasi pengerjaan atau tanggung jawab barang titipan. Maksimal 160 karakter per poin."
        options:
          maxlength: 160
      - name: whatsappNumber
        label: Nomor WhatsApp partner (opsional)
        type: string
        description: "Format 628xxxxxxxxxx. Kosong = nomor WhatsApp cabang di atas."
        pattern:
          regex: '^(62\d{8,13})?$'
          message: Format harus 628xxxxxxxxxx (tanpa +, spasi, atau strip)
      - name: messageTemplate
        label: Template pesan WhatsApp
        type: text
        description: "{partner} = nama partner, {service} = nama layanan (tombol utama: layanan cuci sepatu), {branch} = nama cabang. Pertahankan penanda (via website Cutless) agar pesanan dari website bisa dilacak. Maksimal 500 karakter."
        pattern:
          regex: '^(?:[^{}]|\{(?:partner|service|branch)\})*$'
          message: Placeholder yang boleh dipakai hanya {partner}, {service}, dan {branch}
        options:
          maxlength: 500

