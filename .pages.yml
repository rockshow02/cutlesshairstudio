        label: File daftar menu (PDF)
        type: file
        description: "Opsional: daftar menu lengkap partner dalam bentuk PDF, maksimal ±3 MB (lebih besar = website gagal diperbarui). Tombol Lihat Daftar Menu membuka file ini di tab baru. Bila diisi, Link Daftar Menu di bawah tidak dipakai. Format: PDF."
