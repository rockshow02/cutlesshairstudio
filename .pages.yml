            description: "check = centang, clock = jam, star = bintang, tag = label harga, wash = tetes air, spa = daun, gift = hadiah, pin = lokasi, calendar = kalender, user = orang, info = info, scissors = gunting."
            options:
              values: [check, clock, star, tag, wash, spa, gift, pin, calendar, user, info, scissors]
      - name: services
        label: Layanan
        type: object
        required: true
        list:
          min: 1
          max: 8
        description: "1–8 layanan. Tiap layanan punya tombol Pesan via WhatsApp yang menyebut nama layanannya. Harga opsional; layanan tanpa harga menampilkan Lihat di daftar menu."
