content:
  # ------------------------------------------------------------------ Cabang
  - name: branches
    label: Cabang
    type: file
    path: src/content/branches.json
    format: json
    list: true
    fields:
      - name: slug
        label: Kode URL (slug)
        type: string
        required: true
        description: "Untuk alamat halaman /cabang/<slug>/. Huruf kecil, angka, dan tanda minus, mis. bogor-bantarjati. Jangan diubah setelah tayang. Maksimal 60 karakter."
        pattern:
          regex: "^[a-z0-9]+(-[a-z0-9]+)*$"
          message: Hanya huruf kecil, angka, dan tanda minus (mis. bogor-bantarjati)
        options:
          maxlength: 60
      - name: name
        label: Nama cabang
        type: string
        required: true
        description: "Tanpa nama merek, mis. Bogor Bantarjati. Dipakai di pesan WhatsApp: ...cabang Bogor Bantarjati. Maksimal 60 karakter."
        options:
          maxlength: 60
      - name: city
        label: Kota
        type: string
        required: true
        description: "Dipakai untuk pengelompokan di pemilih cabang, mis. Bogor. Maksimal 60 karakter."
        options:
          maxlength: 60
      - name: province
        label: Provinsi
        type: string
        required: true
        options:
          maxlength: 60
        description: Maksimal 60 karakter.
      - name: address
        label: Alamat lengkap
        type: text
        options:
          maxlength: 300
        description: Maksimal 300 karakter.
      - name: googleMapsUrl
        label: Link Google Maps
        type: string
        description: "Untuk tombol Petunjuk Arah. Buka Google Maps → Bagikan → Salin link."
        pattern:
          regex: "^(https?://.+)?$"
          message: Harus diawali https://
      - name: latitude
        label: Latitude
        type: string
        description: "Untuk fitur Cabang terdekat & peta. Di Google Maps: klik kanan titik lokasi → klik angka koordinat (angka pertama), mis. -6.5761"
        pattern:
          regex: "^(-?\\d{1,2}([.,]\\d+)?)?$"
          message: Angka desimal, mis. -6.5761
      - name: longitude
        label: Longitude
        type: string
        description: "Angka kedua dari koordinat Google Maps, mis. 106.8062"
        pattern:
          regex: "^(-?\\d{1,3}([.,]\\d+)?)?$"
          message: Angka desimal, mis. 106.8062
      - name: whatsappNumber
        label: Nomor WhatsApp cabang
        type: string
        required: true
        description: "Semua tombol booking cabang ini. Format 628xxxxxxxxxx, contoh 6281234567890."
        pattern:
          regex: "^(62\\d{8,13}|TODO.*)$"
          message: Format harus 628xxxxxxxxxx (tanpa +, spasi, atau strip)
      - name: timezone
        label: Zona waktu
        type: select
        default: Asia/Jakarta
        description: "WIB = Asia/Jakarta, WITA = Asia/Makassar, WIT = Asia/Jayapura. Dipakai menghitung status buka."
        options:
          values: [Asia/Jakarta, Asia/Makassar, Asia/Jayapura]
      - name: openingHours
        label: Jam buka
        type: object
        description: "Satu baris per hari, urut Senin–Minggu. Format jam 24 jam, mis. 10:00."
        list:
          max: 7
          collapsible:
            collapsed: true
            summary: "{day}: {openTime}–{closeTime}"
        fields:
          - name: day
            label: Hari
            type: select
            required: true
            options:
              values: [Senin, Selasa, Rabu, Kamis, Jumat, Sabtu, Minggu]
          - name: openTime
            label: Jam buka
            type: string
            pattern:
              regex: "^(([01]\\d|2[0-3]):[0-5]\\d)?$"
              message: Format HH:MM, contoh 10:00
          - name: closeTime
            label: Jam tutup
            type: string
            pattern:
              regex: "^(([01]\\d|2[0-3]):[0-5]\\d)?$"
              message: Format HH:MM, contoh 21:00
          - name: isClosed
            label: Tutup seharian
            type: boolean
            default: false
      - name: status
        label: Status
        type: select
        default: Aktif
        description: "Segera Dibuka & Tutup Sementara tampil dengan label dan TANPA tombol booking."
        options:
          values: [Aktif, Segera Dibuka, Tutup Sementara]
      - name: photo
        label: Foto cabang
        type: image
        description: "Foto studio/fasad, lebar (landscape) minimal 1600 px. Kompres di bawah 1 MB sebelum upload. Dikompres otomatis ke WebP. Format: JPG, PNG, atau WebP."
        options:
          media: branches
          extensions: [jpg, jpeg, png, webp]
      - name: order
        label: Urutan
        type: number
        default: 0
        description: "Angka kecil tampil lebih dulu (10, 20, 30, ...)."
        options:
          min: 0

  # ------------------------------------------------------------------ Daftar Harga
  - name: pricing
    label: Daftar Harga
    type: file
    path: src/content/pricing.json
    format: json
    list: true
    fields:
      - name: name
        label: Nama layanan
        type: string
        required: true
        description: "Contoh: Signature Haircut. Maksimal 80 karakter."
        options:
          maxlength: 80
      - name: category
        label: Kategori
        type: select
        required: true
        default: Haircut
        description: "Kategori aktif: Haircut, Special Treatment, Woman Haircut & Treatment (urutan tampil). Kategori lama hanya untuk item nonaktif. Pilih \"Paket\" untuk paket/membership (tampil sebagai kartu)."
        options:
          values: [Haircut, Special Treatment, Woman Haircut & Treatment, Haircut & Grooming, Wanita, Treatment, Coloring, Perming, Braids & Dreadlock, Shaving, Kids, Paket]
      - name: price
        label: Harga utama (Rupiah)
        type: number
        required: true
        description: "Berlaku di semua cabang, kecuali cabang yang diisi di Harga per cabang. Angka saja, tanpa titik dan tanpa \"Rp\". Contoh: 75000"
        options:
          min: 0
      - name: priceFrom
        label: Harga mulai
        type: boolean
        default: false
        description: "Aktifkan bila harga bisa lebih tinggi (tampil \"mulai Rp ...\")."
      - name: description
        label: Keterangan
        type: text
        description: "Opsional. Untuk kategori Paket, tulis isi paket satu baris per poin. Maksimal 300 karakter."
        options:
          maxlength: 300
      - name: badge
        label: Label khusus
        type: select
        description: "Opsional. Kosongkan bila tidak perlu."
        options:
          values: [Best Seller, Baru, Promo]
      - name: branchPrices
        label: Harga per cabang
        type: object
        description: "Opsional. Kosongkan bila harga sama di semua cabang (memakai Harga utama). Tambah satu baris untuk tiap cabang yang harganya BERBEDA: pilih cabang, lalu isi harga cabang itu (angka saja tanpa titik, mis. 120000). Harga per cabang menimpa Harga utama untuk cabang itu saja."
        list:
          collapsible:
            collapsed: true
            summary: "{branchSlug}: {price}"
        fields:
          - name: branchSlug
            label: Cabang
            type: select
            required: true
            options:
              # @branch-options-start (diisi otomatis dari branches.json oleh scripts/sync-pages-config.mjs)
              values:
                - name: "bogor-bantarjati"
                  label: "Bogor Bantarjati"
                - name: "cibubur"
                  label: "Cibubur"
              # @branch-options-end
          - name: price
            label: Harga di cabang ini (Rupiah)
            type: number
            required: true
            description: "Angka saja, tanpa titik dan tanpa \"Rp\". Contoh: 120000"
            options:
              min: 0
      - name: branchSlugs
        label: Tersedia di cabang
        type: select
        description: "Kosongkan = tersedia di SEMUA cabang. Pilih satu atau beberapa cabang bila layanan ini hanya ada di cabang tertentu (di cabang lain layanan disembunyikan)."
        options:
          multiple: true
          # @branch-options-start (diisi otomatis dari branches.json oleh scripts/sync-pages-config.mjs)
          values:
            - name: "bogor-bantarjati"
              label: "Bogor Bantarjati"
            - name: "cibubur"
              label: "Cibubur"
          # @branch-options-end
      - name: order
        label: Urutan
        type: number
        default: 0
        description: "Angka kecil tampil lebih dulu (10, 20, 30, ...)."
        options:
          min: 0
      - name: isActive
        label: Tampilkan di website
        type: boolean
        default: true
        description: "Matikan untuk menyembunyikan tanpa menghapus."

  # ------------------------------------------------------------------ Video (embed Instagram)
  - name: videos
    label: Video (Instagram)
    type: file
    path: src/content/videos.json
    format: json
    fields:
      - name: enabled
        label: Tampilkan bagian Video
        type: boolean
        default: false
        description: "Aktifkan untuk menampilkan bagian Video di beranda (setelah Galeri). Mati = bagian Video tidak ada. Video diputar dari Instagram (gratis); kartu hanya memuat Instagram setelah pengunjung menekan tombol putar."
      - name: kicker
        label: Teks kecil di atas judul
        type: string
        description: "Opsional, mis. Video. Kosong = Video. Maksimal 40 karakter."
        options:
          maxlength: 40
      - name: title
        label: Judul bagian
        type: string
        required: true
        description: "Mis. Lihat prosesnya langsung. Maksimal 80 karakter."
        options:
          maxlength: 80
      - name: items
        label: Daftar video
        type: object
        list:
          max: 6
          collapsible:
            collapsed: true
            summary: "{caption}"
        description: "Maksimal 6 video (HP: digeser ke samping; desktop: 3 kolom). Hanya Reel atau postingan dari akun Instagram publik. Cara menyalin link & membuat foto sampul: docs/panduan-admin.md → Video."
        fields:
          - name: url
            label: Link Instagram
            type: string
            required: true
            description: "Salin dari Instagram: ••• (atau ikon pesawat/Bagikan) → Salin tautan, mis. https://www.instagram.com/reel/ABC123xyz/. Link Reel (/reel/ atau /reels/) atau postingan (/p/), dari aplikasi maupun browser (instagram.com, www.instagram.com, m.instagram.com). Dirapikan otomatis ke https://www.instagram.com/reel/<kode>/; bagian setelah tanda ? (mis. ?igsh=...) dibuang. Link profil & Story ditolak."
            pattern:
              regex: '^\s*https://((www|m)\.)?instagram\.com/([A-Za-z0-9._]+/)?(reels?|p)/[A-Za-z0-9_-]+/?([?#].*)?\s*$'
              message: "Harus link Reel/postingan Instagram, mis. https://www.instagram.com/reel/ABC123xyz/ (bukan link profil, Story, atau instagr.am)"
          - name: image
            label: Foto sampul
            type: image
            required: true
            description: "Wajib. Screenshot frame terbaik dari video, dipotong tegak rasio 9:16, mis. 1080 × 1920 px. Kompres di bawah 1 MB sebelum upload (maks. 1 MB). Dikompres ke WebP maks. 800 px lebar. Format: JPG, PNG, atau WebP."
            options:
              media: video-covers
              extensions: [jpg, jpeg, png, webp]
          - name: caption
            label: Keterangan
            type: string
            description: "Tampil di bawah kartu & dibacakan pembaca layar, mis. Proses skin fade di cabang Bogor. Kosong = \"video 1\", \"video 2\", ... Maksimal 120 karakter."
            options:
              maxlength: 120
          - name: isActive
            label: Tampilkan
            type: boolean
            default: true
            description: "Matikan untuk menyembunyikan tanpa menghapus."
          - name: order
            label: Urutan
            type: number
            default: 0
            description: "Angka kecil tampil lebih dulu (10, 20, 30, ...)."
            options:
              min: 0

  # ------------------------------------------------------------------ FAQ
  - name: faq
    label: FAQ (tanya-jawab)
    type: file
    path: src/content/faq.json
    format: json
    fields:
      - name: enabled
        label: Tampilkan FAQ
        type: boolean
        default: false
        description: "Aktifkan untuk menampilkan bagian FAQ di beranda (sebelum Lokasi) dan ringkasannya untuk Google & asisten AI. Mati = bagian FAQ tidak ada."
      - name: kicker
        label: Teks kecil di atas judul
        type: string
        description: "Opsional, mis. FAQ. Maksimal 40 karakter."
        options:
          maxlength: 40
      - name: title
        label: Judul bagian
        type: string
        required: true
        description: "Mis. Pertanyaan yang sering ditanyakan. Maksimal 80 karakter."
        options:
          maxlength: 80
      - name: items
        label: Tanya-jawab
        type: object
        list:
          max: 12
          collapsible:
            collapsed: true
            summary: "{question}"
        description: "Maksimal 12 pertanyaan. Tulis hanya fakta yang benar (harga, alamat, jam buka). Pertanyaan tanpa jawaban tidak tampil: simpan dulu dengan Tampilkan mati sampai jawabannya pasti."
        fields:
          - name: question
            label: Pertanyaan
            type: string
            required: true
            description: "Tulis seperti pertanyaan pelanggan, mis. Jam berapa Cutless buka? Maksimal 120 karakter."
            options:
              maxlength: 120
          - name: answer
            label: Jawaban
            type: text
            description: "Jawaban singkat dan jelas. Kosong = pertanyaan tidak tampil. Maksimal 500 karakter."
            options:
              maxlength: 500
          - name: isActive
            label: Tampilkan
            type: boolean
            default: true
            description: "Matikan untuk menyembunyikan tanpa menghapus."
          - name: order
            label: Urutan
            type: number
            default: 0
            description: "Angka kecil tampil lebih dulu (10, 20, 30, ...)."
            options:
              min: 0

  # ------------------------------------------------------------------ Kartu Layanan
  - name: services
    label: Kartu Layanan
    type: file
    path: src/content/services.json
    format: json
    list: true
    fields:
      - name: name
        label: Judul kartu
        type: string
        required: true
        description: "Mis. Coloring. Juga dipakai di pesan WhatsApp tombol Booking. Maksimal 40 karakter."
        options:
          maxlength: 40
      - name: description
        label: Deskripsi
        type: text
        required: true
        description: "Kartu deskriptif bebas (tanpa harga). Sebutkan layanan yang memang tersedia, mis. Cornrow, braids box, dan dreadlock. Maksimal 160 karakter."
        options:
          maxlength: 160
      - name: icon
        label: Ikon
        type: select
        default: scissors
        description: "scissors = gunting, wash = tetes air, shave = pisau cukur, color = palet, perm = gelombang, kids = wajah anak, spa = daun, tattoo = garis, user = orang, star = bintang, gift = hadiah, tag = label."
        options:
          values: [scissors, wash, shave, color, perm, kids, spa, tattoo, user, star, gift, tag]
      - name: pricingCategory
        label: Kategori harga (opsional)
        type: select
        description: "Hanya untuk tautan \"Lihat harga\" yang menggulir ke kategori ini di Daftar Harga. Tautan tidak tampil bila kosong atau kategori tanpa item aktif. Kartu tidak menampilkan harga."
        options:
          values: [Haircut, Special Treatment, Woman Haircut & Treatment, Haircut & Grooming, Wanita, Treatment, Coloring, Perming, Braids & Dreadlock, Shaving, Kids]
      - name: order
        label: Urutan
        type: number
        default: 0
        description: "Angka kecil tampil lebih dulu."
        options:
          min: 0
      - name: isActive
        label: Tampilkan
        type: boolean
        default: true
        description: "Matikan untuk menyembunyikan kartu tanpa menghapusnya."

  # ------------------------------------------------------------------ Partner Cuci Sepatu
  - name: shoeCare
    label: Partner Cuci Sepatu
    type: file
    path: src/content/shoeCare.json
    format: json
    fields:
      - name: enabled
        label: Tampilkan halaman
        type: boolean
        default: false
        description: "Halaman /cuci-sepatu/ beserta teaser, menu Cuci Sepatu (HP & footer), dan sebutan di Google halaman cabang. Mati = /cuci-sepatu dialihkan ke beranda dan semua link hilang."
      - name: showTeaser
        label: Tampilkan teaser di beranda
        type: boolean
        default: true
        description: "Kartu kecil setelah Daftar Harga (beranda & halaman cabang partner) dengan tombol Lihat Layanan ke /cuci-sepatu/. Hanya tampil bila halaman aktif."
      - name: isDemo
        label: Data demo (hapus/matikan sebelum launch)
        type: boolean
        default: false
        description: "Centang untuk isian dummy (badge DEMO tampil di staging). Build produksi GAGAL selama data demo masih tayang. Matikan setelah semua isian diganti data asli partner."
      - name: branchSlug
        label: Cabang
        type: select
        default: bogor-bantarjati
        description: "Satu-satunya cabang tempat layanan ini tersedia. Pengunjung yang memilih cabang lain melihat catatan bahwa layanan hanya ada di cabang ini."
        options:
          # @branch-options-start (diisi otomatis dari branches.json oleh scripts/sync-pages-config.mjs)
          values:
            - name: "bogor-bantarjati"
              label: "Bogor Bantarjati"
            - name: "cibubur"
              label: "Cibubur"
          # @branch-options-end
      - name: name
        label: Nama partner
        type: string
        required: true
        description: "Nama usaha cuci sepatu. Maksimal 60 karakter."
        options:
          maxlength: 60
      - name: heroKicker
        label: Teks kecil di atas judul hero
        type: string
        default: Cuci Sepatu
        description: "Opsional, tampil kecil di atas nama/logo partner di hero (dengan garis di kiri-kanan) dan sebagai label kecil teaser di beranda. Contoh: Cuci Sepatu. Kosongkan untuk menyembunyikan di hero. Maksimal 40 karakter."
        options:
          maxlength: 40
      - name: logo
        label: Logo partner (opsional)
        type: image
        description: "PNG berlatar transparan atau SVG, persegi minimal 400 × 400 px. Kompres di bawah 1 MB sebelum upload. Tampil di hero halaman & teaser. Format: SVG, PNG, atau WebP."
        options:
          media: shoe-care
          extensions: [svg, png, webp]
      - name: heroLogo
        label: Logo hero (versi terang untuk latar gelap)
        type: image
        description: "Opsional. Logo/wordmark berwarna putih atau terang, latar transparan, lebar minimal 1200 px untuk PNG (SVG lebih baik). Kompres di bawah 1 MB sebelum upload. Bila diisi, tampil menggantikan nama partner sebagai judul hero, dan logo kecil di atas Cuci Sepatu disembunyikan. Format: SVG, PNG, atau WebP."
        options:
          media: shoe-care
          extensions: [svg, png, webp]
      - name: tagline
        label: Tagline
        type: string
        description: "Kalimat pendek di bawah judul. Maksimal 120 karakter."
        options:
          maxlength: 120
      - name: description
        label: Deskripsi singkat
        type: text
        description: "1–2 kalimat di hero halaman. Maksimal 300 karakter."
        options:
          maxlength: 300
      - name: heroImage
        label: Foto hero
        type: image
        description: "Foto latar besar di atas halaman, lebar (landscape) minimal 1920 × 1080 px. Kompres di bawah 1 MB sebelum upload. Dikompres otomatis ke WebP 1920 px + versi 1280 & 600 px. Kosong = foto hasil pertama, lalu foto CTA penutup. Format: JPG, PNG, atau WebP."
        options:
          media: shoe-care
          extensions: [jpg, jpeg, png, webp]
      - name: aboutTitle
        label: Judul About Us
        type: string
        description: "Opsional. Kosong = Tentang [nama partner]. Maksimal 60 karakter."
        options:
          maxlength: 60
      - name: aboutParagraphs
        label: Paragraf About Us
        type: text
        list:
          max: 3
        description: "0–3 paragraf tentang partner, satu paragraf per isian (Add an entry untuk paragraf berikutnya; jangan menempel beberapa paragraf di satu isian). Paragraf pertama tampil lebih besar. Kosong = Deskripsi singkat. Maksimal 400 karakter per paragraf."
        options:
          maxlength: 400
      - name: aboutImage
        label: Foto About Us
        type: image
        description: "Opsional. Foto pendamping tegak 4:5, minimal 1000 × 1250 px. Kompres di bawah 1 MB sebelum upload. Format: JPG, PNG, WebP, atau SVG."
        options:
          media: shoe-care
          extensions: [jpg, jpeg, png, webp, svg]
      - name: aboutImageAlt
        label: Deskripsi foto About Us
        type: string
        description: "Wajib bila Foto About Us diisi. Maksimal 150 karakter."
        options:
          maxlength: 150
