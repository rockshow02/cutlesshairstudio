          extensions: [pdf]
      - name: menuUrl
        label: Link Daftar Menu
        type: string
        description: "Opsional, dipakai bila File daftar menu (PDF) kosong: link daftar menu & harga partner (boleh Google Drive), harus diawali https://. Bila keduanya kosong, tombol Lihat Daftar Menu tidak tampil."
        pattern:
          regex: '^(https://\S+)?$'
          message: Harus diawali https://
      - name: advantages
