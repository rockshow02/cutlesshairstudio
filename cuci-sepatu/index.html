<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0c1014" />

    <!-- SEO dasar (statis agar terbaca crawler & preview link WhatsApp/IG tanpa JavaScript).
         %SITE_URL% / %BRAND% / %CITIES% / %SHOE_IMAGE% diisi saat build dari src/content/settings.json & branches.json
         (scripts/vite-content-plugin.ts). %SHOE_*% dari src/content/shoeCare.json (Pages CMS → Partner Cuci Sepatu). Domain TIDAK ditulis manual di sini: ubah siteUrl di Pengaturan Situs. -->
    <title>%SHOE_TITLE%</title>
    <meta name="description" content="%SHOE_DESCRIPTION%" />
    <link rel="canonical" href="%SITE_URL%/cuci-sepatu/" />

    <meta property="og:type" content="website" />
    <meta property="og:locale" content="id_ID" />
    <meta property="og:site_name" content="%BRAND%" />
    <meta property="og:title" content="%SHOE_TITLE%" />
    <meta property="og:description" content="%SHOE_DESCRIPTION%" />
    <meta property="og:url" content="%SITE_URL%/cuci-sepatu/" />
    <meta property="og:image" content="%SHOE_IMAGE%" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="%SHOE_IMAGE%" />
    <!--cutless:shoe-jsonld-->

    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Fonts: Archivo (display, expanded) + Plus Jakarta Sans (body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Font tidak memblokir render: dimuat paralel, diterapkan begitu siap (font-display: swap) -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@125,700;125,800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@125,700;125,800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@125,700;125,800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" /></noscript>
  </head>
  <body>
    <div id="root"><!--cutless:shoe-body--></div>
    <noscript>Aktifkan JavaScript untuk melihat website Cutless Hair Studio, atau hubungi kami via WhatsApp.</noscript>
    <script type="module" src="/src/cuciSepatu.tsx"></script>
  </body>
</html>
