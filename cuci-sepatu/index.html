<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0c1014" />

    <!-- SEO dasar (statis agar terbaca crawler & preview link WhatsApp/IG tanpa JavaScript).
         %SITE_URL% / %BRAND% / %CITIES% / %SHOE_IMAGE% diisi saat build dari src/content/settings.json & branches.json
         (scripts/vite-content-plugin.ts). %SHOE_*% dari src/content/shoeCare.json (Pages CMS → Partner Cuci Sepatu). Domain TIDAK ditulis manual di sini: ubah siteUrl di Pengaturan Situs. -->
    <title>%SHOE_TITLE%</title>
    <meta name="description" content="%SHOE_DESCRIPTION%" />
    <link rel="canonical" href="%SITE_URL%/cuci-sepatu/" />

    <meta property="og:type" content="website" />
    <meta property="og:locale" content="id_ID" />
    <meta property="og:site_name" content="%BRAND%" />
    <meta property="og:title" content="%SHOE_TITLE%" />
    <meta property="og:description" content="%SHOE_DESCRIPTION%" />
    <meta property="og:url" content="%SITE_URL%/cuci-sepatu/" />
    <meta property="og:image" content="%SHOE_IMAGE%" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="%SHOE_IMAGE%" />
    <!--cutless:shoe-jsonld-->

    <!-- Favicon (scripts/make-favicons.mjs): URL tetap tanpa hash; Google memakai ukuran kelipatan 48 px -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192x192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Font di-host sendiri (src/styles/fonts.css, public/fonts/): Archivo (display, expanded) + Plus Jakarta Sans (body).
         File latin di-preload agar sudah ada saat teks pertama kali tergambar (tanpa layout shift karena ganti font). -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/archivo-v1-latin.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/plus-jakarta-sans-v1-latin.woff2" crossorigin />
  </head>
  <body>
    <div id="root"><!--cutless:shoe-body--></div>
    <noscript>Aktifkan JavaScript untuk melihat website Cutless Hair Studio, atau hubungi kami via WhatsApp.</noscript>
    <script type="module" src="/src/cuciSepatu.tsx"></script>
  </body>
</html>
