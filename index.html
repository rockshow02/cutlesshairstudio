<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0c1014" />

    <!-- SEO dasar (statis agar terbaca crawler & preview link WhatsApp/IG tanpa JavaScript).
         %SITE_URL% / %BRAND% / %CITIES% / %OG_IMAGE% diisi saat build dari src/content/settings.json & branches.json
         (scripts/vite-content-plugin.ts). Domain TIDAK ditulis manual di sini: ubah siteUrl di Pengaturan Situs. -->
    <title>%BRAND% | Barbershop &amp; Hair Studio di %CITIES%</title>
    <meta name="description" content="%BRAND%, hair studio di %CITIES% untuk haircut, fade, pompadour, shaving, hair coloring, perming, dan hair spa. Pilih cabang terdekat &amp; booking via WhatsApp." />
    <link rel="canonical" href="%SITE_URL%/" />

    <meta property="og:type" content="website" />
    <meta property="og:locale" content="id_ID" />
    <meta property="og:site_name" content="%BRAND%" />
    <meta property="og:title" content="%BRAND% | Good Style, Good Mood" />
    <meta property="og:description" content="Hair studio di %CITIES%. Haircut, fade, coloring, perming. Booking langsung ke WhatsApp cabang." />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:image" content="%OG_IMAGE%" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="%OG_IMAGE%" />

    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Fonts: Archivo (display, expanded) + Plus Jakarta Sans (body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Font tidak memblokir render: dimuat paralel, diterapkan begitu siap (font-display: swap) -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@125,700;125,800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@125,700;125,800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@125,700;125,800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" /></noscript>

    <link rel="preload" as="image" href="/images/hero/hero-mobile.jpg" media="(max-width: 767px)" />
    <link rel="preload" as="image" href="/images/hero/hero-1280.jpg" imagesrcset="/images/hero/hero-1280.jpg 1280w, /images/hero/hero-1920.jpg 1920w" imagesizes="100vw" media="(min-width: 768px)" />
    <!-- JSON-LD HairSalon semua cabang (diisi saat build) -->
    <!--cutless:jsonld-->
  </head>
  <body>
    <div id="root"></div>
    <noscript>Aktifkan JavaScript untuk melihat website Cutless Hair Studio, atau hubungi kami via WhatsApp.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
