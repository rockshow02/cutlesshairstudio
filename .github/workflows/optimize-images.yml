# Sinkron konten dari Pages CMS:
# 1. Kompres gambar baru di public/uploads ke WebP & perbaiki referensi gambar di src/content/*.json, tips/*.md, kabar/*.md & layanan/*.md
# 2. Salin daftar cabang (branches.json) ke pilihan cabang di .pages.yml (dropdown Barber/Harga/Promo/Pengumuman)
# Berjalan di runner gratis GitHub Actions (repo publik: gratis; privat: 2.000 menit/bulan, 1 run ±1 menit).
# Commit dari GITHUB_TOKEN tidak memicu workflow lagi, jadi tidak ada loop.
# Berjalan di main (edit pemilik) dan staging (uji konten); hasilnya di-commit ke branch yang sama.
name: Sinkron konten

on:
  push:
    branches: [main, staging]
    paths:
      - 'public/uploads/**'
      - 'src/content/*.json'
      - 'src/content/tips/**'
      - 'src/content/kabar/**'
      - 'src/content/layanan/**'
  workflow_dispatch:

# Minimum (yang tidak disebut = none): meng-commit WebP hasil kompres & dropdown cabang .pages.yml ke branch yang sama.
# Default repo tetap "Read"; izin tulis hanya untuk workflow ini, sinkron main → staging, dan rilis versi.
permissions:
  contents: write

concurrency:
  group: sync-content-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependensi
        run: npm ci --no-audit --no-fund

      - name: Kompres gambar ke WebP
        run: npm run optimize-images

      - name: Sinkron pilihan cabang di .pages.yml
        run: npm run sync-cms

      - name: Commit hasil (bila ada perubahan)
        run: |
          if [ -n "$(git status --porcelain -- public/uploads src/content .pages.yml)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/uploads src/content .pages.yml
            git commit -m "chore(cms): sinkron gambar & pilihan cabang"
            # Pages CMS bisa mem-push di antara pull dan push (concurrency group tidak mencakup push dari luar
            # workflow) → ulang pull + push maksimal 3×, jeda 5 dtk lalu 10 dtk. Tidak pernah push paksa; rebase
            # bentrok dibatalkan dan run gagal (konflik tidak diselesaikan otomatis).
            for attempt in 1 2 3; do
              if ! git pull --rebase --autostash; then
                git rebase --abort || true
                echo "::error title=Sinkron konten gagal::rebase bentrok dengan perubahan baru di ${GITHUB_REF_NAME:-branch}; dibatalkan (tanpa force). Selesaikan manual lalu jalankan ulang workflow."
                exit 1
              fi
              if git push; then
                exit 0
              fi
              if [ "$attempt" -lt 3 ]; then
                jeda=$((attempt * ${RETRY_SLEEP_UNIT:-5}))
                echo "::warning title=Sinkron konten: push ditolak::branch berubah di tengah jalan; ulang dalam ${jeda} dtk ($((attempt + 1))/3)"
                sleep "$jeda"
              fi
            done
            echo "::error title=Sinkron konten gagal::push ditolak 3× (branch terus berubah). Jalankan ulang workflow."
            exit 1
          else
            echo "Tidak ada perubahan."
          fi
