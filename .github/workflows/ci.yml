# CI (gratis di repo publik). Alur lengkap: CONTRIBUTING.md.
# Job "verify" dan "e2e" adalah status check WAJIB untuk merge ke main (lihat CONTRIBUTING.md → Branch protection).
#   PR ke main      : hanya dari staging (rilis versi) atau hotfix/* (perbaikan darurat); konten SIAP TAYANG
#                     (CONTENT_CHECK=strict) + build produksi + versi package.json dinaikkan & ada di CHANGELOG.md
#   PR ke staging   : konten boleh belum lengkap (peringatan saja) + build staging
#   push ke main    : termasuk simpanan Pages CMS; verify ketat + build produksi (sama dengan Cloudflare Workers Builds).
#                     Gagal = Cloudflare juga gagal build → tidak deploy, versi sebelumnya tetap tayang (lihat ringkasan run).
name: CI

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [staging, main]
  workflow_dispatch:

# Hanya membaca kode (checkout); tidak menulis apa pun ke repo. Yang tidak disebut = none.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Ketat hanya untuk PR yang menuju produksi
      TARGET: ${{ github.event_name == 'pull_request' && github.base_ref || github.ref_name }}
    steps:
      - name: Asal PR ke main harus staging atau hotfix/*
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          case "$HEAD_REF" in
            staging|hotfix/*) echo "Asal PR: $HEAD_REF (diizinkan)" ;;
            *)
              msg="PR ke main hanya dari \"staging\" (rilis versi) atau \"hotfix/*\" (perbaikan darurat). PR ini dari \"$HEAD_REF\"."
              msg="$msg Fitur: buat PR $HEAD_REF → staging, uji di URL staging, lalu rilis lewat PR staging → main."
              msg="$msg Perbaikan darurat produksi: buat branch hotfix/<nama> dari main. Lihat CONTRIBUTING.md."
              echo "::error title=Asal PR tidak diizinkan::$msg"
              { echo "### ✗ Asal PR tidak diizinkan"; echo; echo "$msg"; } >> "$GITHUB_STEP_SUMMARY"
              exit 1 ;;
          esac

      - uses: actions/checkout@v7
        with:
          # Riwayat & tag lengkap untuk cek versi rilis (tag vX.Y.Z terakhir)
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependensi
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tes unit (skema konten, srcset, pesan WhatsApp)
        run: npm test

      - name: Validasi konten (Zod + relasi cabang + aturan pra-launch)
        run: npm run check:content
        env:
          CONTENT_CHECK: ${{ env.TARGET == 'main' && 'strict' || 'warn' }}

      - name: Build produksi
        if: env.TARGET == 'main'
        run: npm run build

      - name: Web Analytics hanya di build produksi (beacon di semua halaman bila token diisi)
        if: env.TARGET == 'main'
        run: node scripts/check-analytics.mjs production

      - name: Versi rilis dinaikkan & tercatat di CHANGELOG.md
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        run: node scripts/release.mjs check

      - name: Ringkasan bila konten di main gagal
        if: failure() && github.event_name == 'push' && github.ref_name == 'main'
        run: |
          {
            echo "### ✗ Perubahan terakhir di main tidak lolos pemeriksaan"
            echo
            echo "**Website TIDAK berubah:** Cloudflare menjalankan pemeriksaan yang sama saat build produksi, jadi build gagal dan versi sebelumnya tetap tayang di https://cutlesshairstudio.com."
            echo
            echo "**Perbaiki:** buka langkah yang merah di atas (biasanya *Validasi konten*): pesannya menyebut file, entri, dan kolom, mis. \`faq.json: pertanyaan 3 …: aktif tetapi jawabannya kosong\`."
            echo "Betulkan isian itu lewat Pages CMS (branch **main**) lalu Save. Setelah Save berikutnya lolos, website diperbarui otomatis (±3–5 menit)."
            echo
            echo "Commit: \`${GITHUB_SHA::7}\` oleh **${GITHUB_ACTOR}**. Panduan: docs/panduan-admin.md → *Jika website tidak berubah setelah Save*."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build staging
        if: env.TARGET != 'main'
        run: npm run build:staging

      - name: Web Analytics tidak dipasang di staging
        if: env.TARGET != 'main'
        run: node scripts/check-analytics.mjs staging

  # E2E Playwright (360 px & desktop) terhadap Worker statis lokal (wrangler dev, tanpa akun Cloudflare).
  # Memakai build E2E dengan data uji tetap (e2e/fixtures/content.ts), jadi perubahan isi CMS
  # (mis. status cabang) tidak membuat job ini gagal. Gratis di repo publik.
  e2e:
    name: e2e
    # Push ke main = simpanan Pages CMS / merge PR yang e2e-nya sudah lolos; e2e memakai data uji (tidak bergantung konten)
    if: github.event_name != 'push' || github.ref_name != 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependensi
        run: npm ci --no-audit --no-fund

      - name: Cache browser Playwright
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E 360 px & desktop (build E2E + wrangler dev otomatis)
        run: npm run e2e
        env:
          CI: 'true'
          WRANGLER_SEND_METRICS: 'false'

      - name: Simpan trace bila gagal
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-trace
          path: test-results/
          retention-days: 7
