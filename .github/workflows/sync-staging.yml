# Sinkron main → staging: edit konten di produksi (Pages CMS di branch main), rilis, dan hotfix dibawa ke staging
# agar staging tidak tertinggal dan PR rilis berikutnya tidak menimpa konten produksi.
#
# Berjalan di SETIAP push ke main (+ jadwal harian 03.00 WIB sebagai cadangan, + manual: Actions → Run workflow).
# Logikanya di scripts/sync-staging.mjs (diuji tests/syncStaging.test.ts):
#   merge main ke staging di runner → pemeriksaan yang sama dengan CI staging (typecheck, lint, tes, validasi konten,
#   build staging) → push ke staging (Cloudflare mendeploy staging). Push ditolak karena staging berubah → fetch ulang &
#   ulang, maks. 3×. Install & tes unit yang gagal diulang sekali (flaky); lolos saat diulang → jalan terus + peringatan.
#
# Sinkron yang lancar TIDAK membuat PR: PR buatan bot (GITHUB_TOKEN) memicu CI yang menunggu "Approve and run", lalu
# kedaluwarsa merah ("required approval but was not approved before it expired") begitu sinkron me-merge PR itu.
# PR hanya dibuat bila sinkron gagal sungguhan (bentrok / pemeriksaan gagal 2× / push ditolak 3×): label "perlu-dicek"
# + komentar alasan + ringkasan run, dan run ini merah (centang merah di commit main). Tidak pernah gagal diam-diam.
#
# Izin GITHUB_TOKEN diberikan eksplisit di bawah (default repo tetap "Read repository contents"). Perlu (sekali):
#   Settings → Actions → General → centang "Allow GitHub Actions to create and approve pull requests" (gh pr create).
#   Bila staging dilindungi ruleset, tambahkan GitHub Actions ke bypass list (CONTRIBUTING.md → Branch protection).
name: Sinkron main → staging

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 20 * * *' # 20.00 UTC = 03.00 WIB (cadangan; jadwal hanya berjalan dari branch default)
  workflow_dispatch:

# Minimum (yang tidak disebut = none): push hasil merge ke staging; bila gagal: buat PR, buat & pasang label
# "perlu-dicek", dan komentar PR (endpoint label & komentar menerima izin "Pull requests" write, tidak perlu "issues").
permissions:
  contents: write
  pull-requests: write

# Satu sinkron dalam satu waktu (tidak ada dua run yang berebut push ke staging); run baru menunggu, tidak membatalkan
# yang sedang jalan. GitHub hanya menyimpan SATU run yang menunggu: run lebih baru menggantikannya. Aman, karena
# setiap run selalu menyinkronkan main terbaru.
concurrency:
  group: sinkron-staging
  cancel-in-progress: false

env:
  LABEL: perlu-dicek

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: staging
          fetch-depth: 0

      - name: Perlu sinkron?
        id: state
        run: |
          set -euo pipefail
          git fetch --quiet origin main staging
          behind=$(git rev-list --count origin/staging..origin/main)
          echo "behind=$behind" >> "$GITHUB_OUTPUT"
          if [ "$behind" -eq 0 ]; then
            echo "staging sudah memuat semua commit main. Tidak ada yang perlu disinkronkan." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "$behind commit di main belum ada di staging."
          fi

      - uses: actions/setup-node@v7
        if: steps.state.outputs.behind != '0'
        with:
          node-version-file: .node-version
          cache: npm

      - name: Merge, periksa & push ke staging (ulang bila staging berubah, maks. 3×)
        id: sync
        if: steps.state.outputs.behind != '0'
        env:
          CONTENT_CHECK: warn
        # Salinan di luar checkout: setiap percobaan mengganti isi folder kerja dengan staging terbaru
        run: |
          cp scripts/sync-staging.mjs "$RUNNER_TEMP/"
          node "$RUNNER_TEMP/sync-staging.mjs" --cwd "$GITHUB_WORKSPACE"

      - name: Tandai perlu dicek (PR + label + komentar)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          REASON: ${{ steps.sync.outputs.reason }}
        run: |
          set -uo pipefail
          reason=${REASON:-langkah sinkron gagal sebelum merge (lihat log run)}
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          gh label create "$LABEL" --color D93F0B \
            --description "Sinkron main → staging butuh penanganan manual (bentrok / pemeriksaan gagal)" 2>/dev/null || true
          pr=$(gh pr list --base staging --head main --state open --json number --jq '.[0].number // empty')
          if [ -z "$pr" ]; then
            body=$(printf '%s\n' \
              "Sinkron otomatis \`main\` → \`staging\` **berhenti** dan perlu ditangani manual." \
              "" \
              "Alasan: $reason" \
              "" \
              "Log: $run_url" \
              "" \
              "Langkah: CONTRIBUTING.md → *Menyelesaikan sinkron yang perlu dicek*. PR ini tercatat *merged* otomatis begitu staging memuat main." \
              "CI di PR ini dibuat oleh bot: bila GitHub meminta, tekan **Approve and run** di tab Checks.")
            if url=$(gh pr create --base staging --head main --title "chore(sync): main → staging (perlu dicek)" --body "$body" --label "$LABEL"); then
              pr=${url##*/}
            else
              echo "::error title=PR pemberitahuan tidak bisa dibuat::Cek Settings → Actions → General → Allow GitHub Actions to create and approve pull requests. Alasan sinkron: $reason"
            fi
          else
            gh pr edit "$pr" --add-label "$LABEL" || true
            gh pr comment "$pr" --body "⚠ Sinkron otomatis gagal lagi: $reason. Log: $run_url" || true
          fi
          {
            echo "### ⚠ Sinkron main → staging perlu dicek"
            echo
            echo "Alasan: $reason"
            echo
            if [ -n "$pr" ]; then echo "PR: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/pull/$pr (label \`$LABEL\`)"; fi
            echo "Langkah: CONTRIBUTING.md → *Menyelesaikan sinkron yang perlu dicek*."
          } >> "$GITHUB_STEP_SUMMARY"
