<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0c1014" />

    <!-- SEO dasar (statis agar terbaca crawler & preview link WhatsApp/IG tanpa JavaScript).
         %SITE_URL% / %BRAND% / %CITIES% / %OG_IMAGE% diisi saat build dari src/content/settings.json & branches.json
         (scripts/vite-content-plugin.ts). Domain TIDAK ditulis manual di sini: ubah siteUrl di Pengaturan Situs. -->
    <!--cutless:head-start-->
    <title>Cabang %BRAND% | Barbershop di %CITIES%</title>
    <meta name="description" content="Daftar cabang %BRAND% di %CITIES%: alamat, jam buka hari ini, harga, hairstylist, dan booking via WhatsApp." />
    <link rel="canonical" href="%SITE_URL%/cabang/" />
    <meta property="og:title" content="Cabang %BRAND%" />
    <meta property="og:description" content="Pilih cabang terdekat: alamat, jam buka, harga, dan booking via WhatsApp." />
    <meta property="og:url" content="%SITE_URL%/cabang/" />
    <meta property="og:image" content="%OG_IMAGE%" />
    <meta name="twitter:image" content="%OG_IMAGE%" />
    <!--cutless:jsonld-->
    <!--cutless:head-end-->

    <meta property="og:type" content="website" />
    <meta property="og:locale" content="id_ID" />
    <meta property="og:site_name" content="%BRAND%" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Favicon (scripts/make-favicons.mjs): URL tetap tanpa hash; Google memakai ukuran kelipatan 48 px -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192x192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Fonts: Archivo (display, expanded) + Plus Jakarta Sans (body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Font tidak memblokir render: dimuat paralel, diterapkan begitu siap (font-display: swap) -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@125,700;125,800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@125,700;125,800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@125,700;125,800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" /></noscript>
  </head>
  <body>
    <div id="root"><!--cutless:body--></div>
    <noscript>Aktifkan JavaScript untuk melihat website Cutless Hair Studio, atau hubungi kami via WhatsApp.</noscript>
    <script type="module" src="/src/cabang.tsx"></script>
  </body>
</html>
